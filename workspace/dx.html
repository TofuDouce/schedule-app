<!DOCTYPE html>
<html lang="zh-Hant" data-theme="clinic" data-card="solid" data-font="sans" data-texture="none">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow">
<title>門診病代速查 v6（無密碼）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=LXGW+WenKai+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Chiron+GoRound+TC:wght@500;700;900&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════
   門診病代速查 v6 — 與「中正診所 Portal」同一套風格
   暖紙 × 粗墨線框 × 硬陰影 × 資料夾分頁標籤 × 斜紋繃帶條
   主題／字型／卡片樣式／背景材質 皆與 Portal 共用設定
   （localStorage：cz_theme_v7、cz_cfg_v7，需同一網域才會同步）
═══════════════════════════════════════════════════════════ */
:root{
  --lw: 2.5px;
  --r: 16px;
  --fs-card: 16px;   /* 診間字體大小滑桿 */
  --A:#2f7d68; --A2:#4fa088; --Alt:#d9604c;
  --bg:#f5efdf; --surf:#fffdf4; --surf2:#fbf6e4; --border:#d8cfae;
  --line:#25382f; --pop:#25382f;
  --shadow:rgba(37,56,47,.10); --shadowH:rgba(37,56,47,.22);
  --text:#25382f; --sub:#2f7d68; --muted:#7a7a62;
  --warnBg:#FFF3B8; --hdr:#fffdf4; --note:#ffe98a;
}
[data-theme="clinic"]{
  --A:#2f7d68; --A2:#4fa088; --Alt:#d9604c;
  --bg:#f5efdf; --surf:#fffdf4; --surf2:#fbf6e4; --border:#d8cfae;
  --line:#25382f; --pop:#25382f; --text:#25382f; --sub:#2f7d68; --muted:#7a7a62; --hdr:#fffdf4;
}
[data-theme="rose"]{
  --A:#b0585c; --A2:#d07f80; --Alt:#e3a14a;
  --bg:#f8e7e1; --surf:#fff8f4; --surf2:#fbeae4; --border:#e8c6bb;
  --line:#432727; --pop:#432727; --text:#432727; --sub:#b0585c; --muted:#9a7c72; --hdr:#fff8f4;
}
[data-theme="ocean"]{
  --A:#2f6fa3; --A2:#5a96c6; --Alt:#e7a03d;
  --bg:#e0ecf4; --surf:#f8fbfe; --surf2:#e8f1f8; --border:#c4d9e8;
  --line:#1b3247; --pop:#1b3247; --text:#1b3247; --sub:#2f6fa3; --muted:#6f8aa0; --hdr:#f8fbfe;
}
[data-theme="light"]{
  --A:#2C5F8A; --A2:#3A7AB5; --Alt:#e0573f;
  --bg:#EDF2F7; --surf:#FFFFFF; --surf2:#F0F5FA; --border:#C8D9EC;
  --line:#16293b; --pop:#16293b; --text:#16293b; --sub:#2C5F8A; --muted:#5A7FA0; --hdr:#FFFFFF;
}
[data-theme="ash"]{
  --A:#3E4C6E; --A2:#6577a0; --Alt:#c98a3f;
  --bg:#EAE6DC; --surf:#F8F6F0; --surf2:#EFEBE1; --border:#D3CDBB;
  --line:#22232b; --pop:#22232b; --text:#22232b; --sub:#3E4C6E; --muted:#7c766a; --hdr:#F8F6F0;
}

[data-font="pingfang"]{ --ff:"PingFang TC","Noto Sans TC",sans-serif; }
[data-font="sans"],[data-font="sourcesans"]{ --ff:"Noto Sans TC","PingFang TC",sans-serif; }
[data-font="serif"],[data-font="sourceserif"]{ --ff:"Noto Serif TC",serif; }
[data-font="wenkai"]{ --ff:"LXGW WenKai TC","Noto Serif TC",serif; }
[data-font="goround"]{ --ff:"Chiron GoRound TC","Noto Sans TC",sans-serif; }
[data-font="maru"]{ --ff:"Zen Maru Gothic","Noto Sans TC",sans-serif; }

/* 背景材質（跟 Portal 設定） */
[data-texture="dots"] body::after{opacity:1;background-image:radial-gradient(circle,color-mix(in srgb,var(--line) 22%,transparent) 1.2px,transparent 1.6px);background-size:22px 22px;}
[data-texture="grid"] body::after{opacity:1;background-image:linear-gradient(color-mix(in srgb,var(--line) 12%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 12%,transparent) 1px,transparent 1px);background-size:32px 32px;}
[data-texture="none"] body::after{opacity:0;}

/* 卡片樣式（跟 Portal 設定） */
[data-card="flat"] .card{box-shadow:none;}
[data-card="flat"] .card:hover{box-shadow:0 0 0 var(--lw) var(--A);transform:none;}
[data-card="glass"] .card{background:color-mix(in srgb,var(--surf) 68%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px var(--shadow);}
[data-card="ios"] .card{background:color-mix(in srgb,var(--surf) 52%,transparent);backdrop-filter:saturate(180%) blur(26px);-webkit-backdrop-filter:saturate(180%) blur(26px);box-shadow:0 10px 30px var(--shadow);border-color:color-mix(in srgb,var(--line) 55%,transparent);}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:auto;}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:var(--ff,"Noto Sans TC",sans-serif);
  font-size:18px;line-height:1.6;letter-spacing:.02em;
  overflow-x:hidden;transition:background .3s,color .3s;
}
/* 紙張橫格線＋柔光 */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,transparent 0 35px,color-mix(in srgb,var(--line) 7%,transparent) 35px 36px),
    radial-gradient(ellipse 60% 45% at 100% 0%,color-mix(in srgb,var(--A) 10%,transparent),transparent 70%),
    radial-gradient(ellipse 50% 40% at 0% 100%,color-mix(in srgb,var(--Alt) 9%,transparent),transparent 70%);}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .3s;}
button,input{font-family:inherit;}
::selection{background:var(--Alt);color:#fff;}

/* ───────── 表頭＋斜紋繃帶條 ───────── */
.hdr{
  position:relative;z-index:2;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 96px 18px 28px;
  background:var(--hdr);border-bottom:var(--lw) solid var(--line);
}
.hdr::after{content:'';position:absolute;left:0;right:0;bottom:calc(-1 * var(--lw) - 9px);height:9px;border-bottom:var(--lw) solid var(--line);
  background:repeating-linear-gradient(-45deg,var(--A) 0 9px,var(--surf) 9px 18px);}
.logo{display:flex;align-items:center;gap:14px;min-width:0;}
.logo-icon{flex:none;width:54px;height:54px;border-radius:14px;background:var(--A);border:var(--lw) solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 var(--pop);transform:rotate(-5deg);}
.logo-icon svg{width:30px;height:30px;display:block;}
.logo-name{font-size:clamp(24px,3vw,30px);font-weight:900;letter-spacing:.06em;line-height:1.15;}
.logo-sub{display:inline-block;font-family:"Inter",monospace;font-size:11px;font-weight:900;letter-spacing:3px;color:#fff;background:var(--Alt);padding:1px 8px 1px 10px;margin-top:4px;border-radius:4px;transform:rotate(-1.5deg);}
.hint-note{
  flex:none;background:var(--note);color:#2b2a1c;border:var(--lw) solid var(--line);
  border-radius:6px 6px 14px 6px;padding:9px 16px;font-size:15px;font-weight:800;
  box-shadow:4px 4px 0 var(--pop);transform:rotate(1.5deg);position:relative;
}
.hint-note::before{content:'';position:absolute;top:-11px;left:50%;width:56px;height:18px;transform:translateX(-50%) rotate(-3deg);
  background:color-mix(in srgb,var(--A) 40%,transparent);border:2px solid color-mix(in srgb,var(--line) 45%,transparent);}

/* ───────── 吸附：快速跳轉 ───────── */
.sticky-wrap{
  position:sticky;top:0;z-index:600;
  background:var(--hdr);
  border-top:var(--lw) solid var(--line);border-bottom:var(--lw) solid var(--line);
  padding:10px 90px 12px 28px;margin-top:14px;
  box-shadow:0 5px 0 color-mix(in srgb,var(--pop) 14%,transparent);
}
.quicknav-label{display:inline-block;align-self:center;font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--Alt);
  border:2px double var(--Alt);border-radius:6px;padding:0 10px 0 12px;margin:0 4px 0 2px;transform:rotate(-1.5deg);background:var(--surf);}
.quicknav{display:flex;flex-wrap:wrap;gap:9px;}
.quicknav-btn{
  background:var(--surf);color:var(--text);border:2px solid var(--line);border-radius:10px;
  font-size:19px;font-weight:900;letter-spacing:.04em;padding:5px 15px 6px;cursor:pointer;white-space:nowrap;
  box-shadow:3px 3px 0 var(--pop);transition:transform .1s,box-shadow .1s,background .15s,color .15s;
}
.quicknav-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--A);background:color-mix(in srgb,var(--A) 14%,var(--surf));}
.quicknav-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--pop);}
.quicknav-btn.quicknav-special{background:var(--Alt);color:#fff;}
.quicknav-btn.quicknav-special:hover{box-shadow:4px 4px 0 var(--pop);filter:brightness(1.06);}

/* ───────── 主體 ───────── */
.container-wrap{position:relative;z-index:1;max-width:1520px;margin:0 auto;padding:10px 28px 40px;}
.section{margin-bottom:12px;}

/* 區塊標籤：資料夾分頁 */
.sec-label{display:flex;align-items:flex-end;margin:38px 0 22px;user-select:none;}
.section:first-child .sec-label{margin-top:24px;}
.sec-pill{position:relative;display:flex;align-items:center;gap:8px;background:var(--A);color:#fff;
  font-size:18px;font-weight:900;padding:9px 20px 8px;letter-spacing:.12em;
  border:var(--lw) solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);}
.sec-pill::after{content:'';position:absolute;left:0;right:0;bottom:calc(-1 * var(--lw));height:var(--lw);background:var(--A);}
.sec-line{flex:1;height:0;border-bottom:var(--lw) solid var(--line);}
.section.special .sec-pill{background:var(--Alt);}
.section.special .sec-pill::after{background:var(--Alt);}

/* 卡片：索引卡 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 22px;counter-reset:cardno;padding-top:6px;}
.card{
  position:relative;background:var(--surf);border:var(--lw) solid var(--line);border-radius:var(--r);
  box-shadow:5px 5px 0 var(--pop);cursor:pointer;
  padding:32px 16px 18px;min-height:112px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;
  counter-increment:cardno;
  transition:transform .15s cubic-bezier(.3,1.5,.5,1),box-shadow .15s;
}
.anim .card{animation:cardIn .4s cubic-bezier(.3,1.4,.5,1) both;}
.anim .card:nth-child(2){animation-delay:.03s}.anim .card:nth-child(3){animation-delay:.06s}.anim .card:nth-child(4){animation-delay:.09s}
.anim .card:nth-child(n+5){animation-delay:.12s}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) rotate(-1deg)}to{opacity:1;transform:none}}
.card::before{content:"№ " counter(cardno,decimal-leading-zero);position:absolute;top:9px;left:14px;font-family:"Inter",monospace;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);}
.card::after{content:'';position:absolute;top:10px;right:14px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--line);box-shadow:inset 1px 1px 0 rgba(0,0,0,.18);}
.card:hover{transform:translate(-3px,-3px) rotate(-.4deg);box-shadow:8px 8px 0 var(--A);}
.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pop);}
.card.hl{background:var(--warnBg);}
.section.special .card:hover{box-shadow:8px 8px 0 var(--Alt);}

.code{
  font-family:"Inter","Noto Sans TC",monospace;
  font-weight:900;color:var(--A);font-size:calc(var(--fs-card) + 4px);letter-spacing:.04em;line-height:1.2;word-break:break-all;
}
.section.special .code{color:var(--Alt);}
.name{
  width:100%;padding-top:9px;border-top:2px dashed color-mix(in srgb,var(--line) 35%,transparent);
  font-size:var(--fs-card);font-weight:800;color:var(--text);line-height:1.4;word-break:break-word;
}
.small-note{display:block;margin-top:3px;font-size:85%;font-weight:600;color:var(--muted);}
.empty{text-align:center;padding:40px;color:var(--muted);font-weight:800;border:2px dashed color-mix(in srgb,var(--line) 40%,transparent);border-radius:14px;margin-top:24px;}

/* ───────── 浮動按鈕 ───────── */
.ctrl{
  position:fixed;width:54px;height:54px;border-radius:14px;border:var(--lw) solid var(--line);background:var(--surf);color:var(--text);
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:4px 4px 0 var(--pop);transition:transform .12s,box-shadow .12s,background .15s,opacity .25s;
}
.ctrl:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--A);}
.ctrl:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--pop);}
.ctrl.active{background:var(--A);color:#fff;}
#searchToggleBtn{top:22px;right:24px;z-index:1100;}
#settingsBtn{right:24px;bottom:24px;z-index:1000;}
#backToTopBtn{left:24px;bottom:24px;z-index:1000;opacity:0;pointer-events:none;}
#backToTopBtn.show{opacity:1;pointer-events:auto;}

/* 展開式搜尋 */
.search-float-panel{position:fixed;top:22px;right:92px;width:min(440px,calc(100vw - 120px));z-index:1090;
  opacity:0;visibility:hidden;transform:translateX(14px);pointer-events:none;transition:opacity .2s,transform .2s,visibility .2s;}
.search-float-panel.show{opacity:1;visibility:visible;transform:none;pointer-events:auto;}
.search{
  width:100%;height:54px;padding:0 18px;border:var(--lw) solid var(--line);border-radius:12px;
  background:var(--surf);color:var(--text);font-size:17px;font-weight:700;
  box-shadow:3px 3px 0 var(--pop);transition:box-shadow .15s,transform .15s;
}
.search::placeholder{color:var(--muted);font-weight:600;}
.search:focus{outline:none;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--A);}

/* 設定面板：便條卡 */
.settings-panel{
  position:fixed;right:24px;bottom:94px;width:min(320px,calc(100vw - 48px));z-index:999;
  background:var(--surf2);border:var(--lw) solid var(--line);border-radius:14px;box-shadow:6px 6px 0 var(--pop);
  padding:24px 18px 18px;display:none;
}
.settings-panel.show{display:block;animation:cardIn .25s both;}
.panel-tag{position:absolute;top:-15px;left:14px;font-size:13px;font-weight:900;color:#fff;background:var(--Alt);border:2px solid var(--line);border-radius:8px;padding:2px 12px;letter-spacing:.12em;transform:rotate(-1.5deg);}
.setting-title{font-size:15px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:4px 0 8px;}
.srow{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.srow input[type=range]{flex:1;accent-color:var(--A);height:6px;cursor:pointer;}
.sval{font-size:13px;font-weight:900;min-width:48px;text-align:center;color:var(--text);background:var(--surf);border:2px solid var(--line);border-radius:8px;padding:1px 4px;}
.theme-swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.theme-swatch{
  display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:10px 12px 9px;text-align:left;
  border-radius:12px;border:2px solid var(--line);background:var(--surf);cursor:pointer;color:var(--text);
  box-shadow:3px 3px 0 var(--pop);transition:transform .12s,box-shadow .12s,background .15s;appearance:none;-webkit-appearance:none;
}
.theme-swatch:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--pop);}
.theme-swatch:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pop);}
.theme-swatch.on{background:color-mix(in srgb,var(--A) 14%,var(--surf));box-shadow:3px 3px 0 var(--A);}
.theme-swatch .dots{display:flex;gap:6px;}
.theme-swatch .dots i{width:20px;height:20px;border-radius:50%;display:block;border:2px solid var(--line);}
.theme-swatch b{font-size:13px;font-weight:800;letter-spacing:.03em;line-height:1.2;}

/* 複製提示 */
.toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:1200;
  background:var(--A);color:#fff;border:var(--lw) solid var(--line);border-radius:12px;
  padding:12px 26px;font-size:17px;font-weight:900;letter-spacing:.06em;box-shadow:4px 4px 0 var(--pop);
  opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s;white-space:nowrap;
}
.toast.show{opacity:1;bottom:106px;}

.footer-space{height:70px;}

@media(max-width:700px){
  .hdr{padding:14px 78px 14px 14px;}
  .hint-note{display:none;}
  .logo-icon{width:46px;height:46px;}
  .logo-name{font-size:23px;white-space:nowrap;}
  .sticky-wrap{padding:8px 74px 10px 14px;}
  .quicknav{gap:7px;}
  .quicknav-btn{font-size:17px;padding:4px 11px 5px;border-radius:9px;box-shadow:2px 2px 0 var(--pop);}
  .container-wrap{padding:6px 14px 30px;}
  .grid{gap:20px 16px;}
  .search-float-panel{right:84px;width:calc(100vw - 104px);}
  #searchToggleBtn{right:14px;}
  .toast{max-width:calc(100vw - 28px);white-space:normal;text-align:center;}
}
/* ───────── v6.1：可編輯＋雲端同步 ───────── */
.quicknav-btn.quicknav-hot{background:var(--warnBg);}
.card.multi{padding:34px 14px 16px;align-items:stretch;text-align:left;gap:10px;cursor:default;}
@media(min-width:560px){.card.multi{grid-column:span 2;}}
.mtitle{font-size:calc(var(--fs-card) + 2px);font-weight:900;color:var(--text);text-align:center;letter-spacing:.04em;line-height:1.3;}
.mrows{display:flex;flex-direction:column;gap:8px;}
.mrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--surf2);color:var(--text);border:2px solid var(--line);border-radius:10px;padding:8px 12px;
  box-shadow:3px 3px 0 var(--pop);transition:transform .1s,box-shadow .1s;}
.mrow:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--A);}
.mrow:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--pop);}
.mlab{flex:none;font-size:calc(var(--fs-card) - 2px);font-weight:900;color:#fff;background:var(--A);border:2px solid var(--line);border-radius:7px;padding:0 8px;}
.mrow:nth-child(n+2) .mlab{background:var(--Alt);}
.mcode{flex:none;font-family:"Inter","Noto Sans TC",monospace;font-size:calc(var(--fs-card) + 3px);font-weight:900;color:var(--A);letter-spacing:.04em;}
.mname{font-size:var(--fs-card);font-weight:800;line-height:1.3;word-break:break-word;}

/* 編輯模式 */
.edit-bar{background:var(--note);color:#2b2a1c;border:var(--lw) solid var(--line);border-radius:12px;box-shadow:4px 4px 0 var(--pop);
  padding:12px 14px;margin:18px 0 4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-weight:800;font-size:15px;}
.edit-bar b{font-size:16px;margin-right:6px;}
.mini{padding:6px 12px;border:2px solid var(--line);border-radius:9px;background:var(--surf);color:var(--text);font-size:14px;font-weight:900;cursor:pointer;box-shadow:2px 2px 0 var(--pop);transition:transform .1s,box-shadow .1s;}
.mini:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--pop);}
.mini:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--pop);}
.mini.pri{background:var(--A);color:#fff;}
.mini.danger{color:#C0392B;border-color:#C0392B;}
.sec-tools{display:flex;flex-wrap:wrap;gap:8px;margin:-8px 0 14px;}
.card.editing{cursor:pointer;outline:2.5px dashed var(--Alt);outline-offset:3px;}
.card.editing::after{content:'✏️';width:auto;height:auto;border:0;background:none;box-shadow:none;font-size:14px;top:6px;right:10px;}
.add-sec{display:block;width:100%;margin-top:30px;padding:16px;border:var(--lw) dashed var(--line);border-radius:14px;background:transparent;color:var(--text);font-size:18px;font-weight:900;cursor:pointer;}
.add-sec:hover{background:var(--surf2);border-style:solid;}

.btn-prim{width:100%;padding:12px;font-size:16px;font-weight:900;letter-spacing:.08em;border:var(--lw) solid var(--line);border-radius:12px;cursor:pointer;background:var(--A);color:#fff;box-shadow:4px 4px 0 var(--pop);transition:transform .1s,box-shadow .1s;}

  container.innerHTML = "";

      <button class="mini" data-a="exit">結束編輯</button>`;
    bar.onclick = e => { const a = e.target.closest("[data-a]"); if (a) barAction(a.dataset.a); };
    container.appendChild(bar);
  }

  const kw = keyword.trim().toLowerCase();
  const kwNoDot = kw.replace(/\./g, "");
  const match = card => {
    if (!kw) return true;
    const hay = card.rows
      ? [card.t, ...card.rows.flatMap(r => [r.c, r.n, r.l])]
      : [card.c, card.n, card.s];
    return hay.some(x => { const v = String(x || "").toLowerCase(); return v.includes(kw) || v.includes(kwNoDot); });

    total += list.length;

    const el = document.createElement("div");
    el.id = "sec-" + sec.id;
    el.className = "section" + (sec.kind === "special" ? " special" : "");
    el.innerHTML = `<div class="sec-label"><div class="sec-pill">${esc(sec.title)}</div><div class="sec-line"></div></div>`;

    if (editMode && !kw) {
      const t = document.createElement("div");

      t.innerHTML = `<button class="mini pri" data-a="addcard">＋新增小卡</button>

      };
      el.appendChild(t);

    const grid = document.createElement("div");
    grid.className = "grid";
    list.forEach(([card, ci]) => grid.appendChild(makeCard(sec, card, ci)));
    el.appendChild(grid);
    container.appendChild(el);
  });

  if (editMode && !kw) {
    const b = document.createElement("button");
    b.className = "add-sec"; b.textContent = "＋ 新增分類";
    b.onclick = () => openSectionEditor(null);
    container.appendChild(b);
  } else if (total === 0) {
    container.insertAdjacentHTML("beforeend", '<div class="empty">找不到符合的病代，換個關鍵字試試</div>');
  }
  applyFontSize(fontSlider.value);
}

function makeCard(sec, card, ci) {
  const el = document.createElement("div");
  el.className = "card" + (sec.kind === "hot" ? " hl" : "") + (card.rows ? " multi" : "") + (editMode ? " editing" : "");
  if (card.rows) {
    el.innerHTML = `<div class="mtitle">${esc(card.t)}</div><div class="mrows">` +
      card.rows.map((r, i) => `<button type="button" class="mrow" data-i="${i}"><span class="mlab">${esc(r.l)}</span><span class="mcode">${esc(r.c)}</span><span class="mname">${esc(r.n)}</span></button>`).join("") +
      `</div>`;
    el.querySelectorAll(".mrow").forEach(b => b.onclick = e => {
      if (editMode) return;                      // 編輯模式：冒泡到卡片 → 開編輯視窗
      e.stopPropagation(); copyText(cleanCode(card.rows[b.dataset.i].c));
    });
  } else {
    el.innerHTML = `<div class="code">${esc(card.c)}</div><div class="name">${esc(card.n)}${card.s ? `<span class="small-note">${esc(card.s)}</span>` : ""}</div>`;
  }
  el.onclick = () => {
    if (editMode) openCardEditor(sec.id, ci);
    else if (!card.rows) copyText(cleanCode(card.c));
  };
  return el;
}

/* ───────── 快速跳轉 ───────── */
function buildQuickNav() {
  const nav = $("#quickNav");
  nav.innerHTML = '<div class="quicknav-label">⚡ 快速跳轉</div>';
  sections.forEach(s => {
    if (!s.nav) return;
    const b = document.createElement("button");
    b.className = "quicknav-btn" + (s.kind === "special" ? " quicknav-special" : s.kind === "hot" ? " quicknav-hot" : "");
    b.textContent = s.nav;
    b.onclick = () => jumpToSection(s.id);
    nav.appendChild(b);
  });
}
function jumpToSection(id) {
  if (keyword) { keyword = ""; $("#searchInput").value = ""; render(); }
  closeSearchPanel();
  setTimeout(() => {
    const el = document.getElementById("sec-" + id);
    if (!el) return;
    const sticky = document.querySelector(".sticky-wrap");
    const y = window.pageYOffset + el.getBoundingClientRect().top - (sticky ? sticky.offsetHeight : 0) - 14;
    window.scrollTo({ top: Math.max(y, 0), behavior: "smooth" });
  }, 60);
}

/* ───────── 儲存／同步 ───────── */
function cacheSave() { try { localStorage.setItem(CACHE_KEY, JSON.stringify(sections)); } catch(e){} }
function persist() {
  cacheSave(); render(); buildQuickNav();
  setSync("saving");
  Store.save(clone(sections)).then(() => setSync("ok")).catch(e => setSync("err", e));
}
function setSync(state, err) {
  if (Store.mode === "local") syncMsg = "📴 離線模式：只存在這台裝置";
  else if (state === "saving") syncMsg = "⏳ 儲存中…";
  else if (state === "err") syncMsg = "⚠️ 同步失敗：" + (err?.code || err?.message || "請檢查網路／Firestore 規則");
  else if (state === "ok") syncMsg = "🔥 已與雲端同步";
  else syncMsg = "連線中…";
  const el = $("#syncState"); if (el) el.textContent = syncMsg;
}

async function initStore() {
  try {
    const [appMod, fsm] = await Promise.race([
      Promise.all([
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
      ]),
      new Promise((_, rej) => setTimeout(() => rej(new Error("Firebase 載入逾時")), 8000))
    ]);
    const db = fsm.getFirestore(appMod.initializeApp(firebaseConfig, "icd"));
    const ref = fsm.doc(db, "icd", "main");
    Store = {
      mode: "fire",
      save: secs => fsm.setDoc(ref, { v: 1, sections: secs, updated: Date.now() })
    };
    fsm.onSnapshot(ref, snap => {
      if (snap.exists() && Array.isArray(snap.data().sections) && snap.data().sections.length) {
        const cloud = snap.data().sections;
        if (JSON.stringify(cloud) !== JSON.stringify(sections)) {
          sections = cloud; cacheSave(); render(); buildQuickNav();
        }
      }
      setSync("ok");
    }, err => setSync("err", err));
  } catch (e) {
    console.warn("Firebase 載入失敗，改用離線模式", e);
    Store = { mode: "local", save: () => Promise.resolve() };
    setSync("ok");
  }
}

/* ───────── 解鎖／編輯模式 ───────── */
function setEditMode(on) {
  editMode = on;
  $("#editToggleBtn").textContent = on ? "🔒 結束編輯" : "🔓 解鎖編輯";
  render();
}
function toggleEdit() {
  if (editMode) return setEditMode(false);
  return setEditMode(true);   // 無密碼版：直接進入編輯模式
  openModal("🔓 輸入編輯密碼", `
    <div class="fld"><label>密碼（同中正診所行事曆）</label><input class="inp" id="pwIn" type="password" inputmode="numeric" autocomplete="off"></div>
    <label class="hintx"><input type="checkbox" id="pwRemember"> 這台裝置記住（不用每次輸入）</label>
    <div class="hintx" id="pwMsg"></div>`,
    [{ t: "取消", fn: closeModal }, { t: "解鎖", pri: true, fn: tryUnlock }]);
  $("#pwIn").addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
  setTimeout(() => $("#pwIn").focus(), 80);
}
function tryUnlock() {
  if ($("#pwIn").value === EDIT_PASSWORD) {
    (($("#pwRemember").checked) ? localStorage : sessionStorage).setItem("icd_edit", "1");
    closeModal(); settingsPanel.classList.remove("show"); setEditMode(true);
  } else { $("#pwMsg").textContent = "❌ 密碼不對，再試一次。"; $("#pwIn").value = ""; $("#pwIn").focus(); }
}
$("#editToggleBtn").onclick = e => { e.stopPropagation(); toggleEdit(); };

function barAction(a) {
  if (a === "addsec") openSectionEditor(null);
  else if (a === "exit") { sessionStorage.removeItem("icd_edit"); localStorage.removeItem("icd_edit"); setEditMode(false); }
  else if (a === "export") {
    const blob = new Blob([JSON.stringify(sections, null, 1)], { type: "application/json" });
    const a2 = document.createElement("a"); a2.href = URL.createObjectURL(blob);
    a2.download = "門診病代_備份_" + new Date().toISOString().slice(0, 10) + ".json"; a2.click();
  }
  else if (a === "import") $("#importFile").click();
  else if (a === "push") { persist(); }
  else if (a === "reset") { if (confirm("確定把所有分類與小卡還原成預設內容？（你自己新增／修改的會被覆蓋）")) { sections = clone(DEFAULT_SECTIONS); persist(); } }
}
$("#importFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d) || !d.every(s => s && s.title && Array.isArray(s.cards))) throw new Error("格式不對");
      if (confirm("用這份備份覆蓋目前所有內容？")) { sections = d.map(s => ({ ...s, id: s.id || uid() })); persist(); }
    } catch (err) { alert("匯入失敗：" + err.message); }
  };
  r.readAsText(f); e.target.value = "";
};

/* ───────── 資料操作 ───────── */
function moveSection(id, d) {
  const i = sections.findIndex(s => s.id === id), j = i + d;
  if (j < 0 || j >= sections.length) return;
  [sections[i], sections[j]] = [sections[j], sections[i]]; persist();
}

/* ───────── 彈出視窗 ───────── */
function openModal(title, bodyHtml, buttons) {
  $("#mpTitle").textContent = title;
  $("#mpBody").innerHTML = bodyHtml;
  const foot = $("#mpFoot"); foot.innerHTML = "";
  buttons.forEach(b => {
    const el = document.createElement("button");
    el.className = "mini" + (b.pri ? " pri" : "") + (b.danger ? " danger" : "");
    el.textContent = b.t; el.onclick = b.fn; foot.appendChild(el);
  });
  $("#modalOverlay").classList.add("show"); $("#modalPanel").classList.add("show");
}
function closeModal() { $("#modalOverlay").classList.remove("show"); $("#modalPanel").classList.remove("show"); }
$("#modalOverlay").onclick = closeModal;
$("#mpClose").onclick = closeModal;

function openSectionEditor(id) {
  const sec = id ? sections.find(s => s.id === id) : { id: uid(), title: "", nav: "", kind: "normal", cards: [] };
  let kind = sec.kind || "normal";
  openModal(id ? "✏️ 編輯分類" : "＋ 新增分類", `
    <div class="fld"><label>分類標題（可加 emoji）</label><input class="inp" id="seTitle" value="${esc(sec.title)}" placeholder="例如：🩼 常用扭傷"></div>
    <div class="fld"><label>快速跳轉按鈕文字（留空＝不顯示按鈕）</label><input class="inp" id="seNav" value="${esc(sec.nav || "")}" placeholder="例如：扭傷"></div>
    <div class="fld"><label>配色</label><div class="seg" id="seKind">
      <button type="button" class="mini" data-k="normal">一般</button>
      <button type="button" class="mini" data-k="special">特殊（紅色）</button>
      <button type="button" class="mini" data-k="hot">常用（黃底小卡）</button></div></div>`,
    [
      ...(id ? [{ t: "🗑 刪除分類", danger: true, fn: () => { if (confirm(`刪除「${sec.title}」與裡面 ${sec.cards.length} 張小卡？`)) { sections = sections.filter(s => s.id !== id); closeModal(); persist(); } } }] : []),
      { t: "取消", fn: closeModal },
      { t: "儲存", pri: true, fn: () => {
          const title = $("#seTitle").value.trim(); if (!title) return $("#seTitle").focus();
          sec.title = title; sec.nav = $("#seNav").value.trim(); sec.kind = kind;
          if (!sec.nav) delete sec.nav;
          if (!id) sections.push(sec);
          closeModal(); persist();
          if (!id) setTimeout(() => jumpToSection(sec.id), 120);
      } }
    ]);
  const paint = () => document.querySelectorAll("#seKind .mini").forEach(b => b.classList.toggle("on", b.dataset.k === kind));
  document.querySelectorAll("#seKind .mini").forEach(b => b.onclick = () => { kind = b.dataset.k; paint(); });
  paint();
}

function openCardEditor(secId, ci) {
  const sec = sections.find(s => s.id === secId);
  const isNew = ci === null;
  const orig = isNew ? { c: "", n: "" } : clone(sec.cards[ci]);
  let multi = !!orig.rows;
  let rows = multi ? clone(orig.rows) : [{ l: "主", c: "", n: "" }, { l: "次", c: "", n: "" }];

  const body = () => `
    <div class="fld"><label>卡片類型</label><div class="seg" id="ceType">
      <button type="button" class="mini ${multi ? "" : "on"}" data-m="0">單一代碼</button>
      <button type="button" class="mini ${multi ? "on" : ""}" data-m="1">多代碼組合（主／次）</button></div></div>
    ${multi ? `
      <div class="fld"><label>標題</label><input class="inp" id="ceT" value="${esc(orig.t || "")}" placeholder="例如：①胃幽門桿菌給藥"></div>
      <div class="fld"><label>代碼列（標籤／代碼／說明）</label><div id="ceRows" style="display:flex;flex-direction:column;gap:6px">
        ${rows.map((r, i) => `<div class="row3" data-i="${i}"><input class="inp" data-f="l" value="${esc(r.l)}" placeholder="主"><input class="inp" data-f="c" value="${esc(r.c)}" placeholder="代碼"><input class="inp" data-f="n" value="${esc(r.n)}" placeholder="說明"><button type="button" class="mini danger" data-del="${i}">✕</button></div>`).join("")}
      </div><button type="button" class="mini" id="ceAddRow" style="align-self:flex-start">＋加一列</button></div>`
    : `
      <div class="fld"><label>代碼</label><input class="inp" id="ceC" value="${esc(orig.c || "")}" placeholder="例如：S93401A　或　[341] K297"><div class="hintx">可寫成「[舊碼] 新碼」，點卡片時只會複製最後面的新碼。</div></div>
      <div class="fld"><label>名稱</label><input class="inp" id="ceN" value="${esc(orig.n || "")}" placeholder="例如：右踝扭傷"></div>
      <div class="fld"><label>小字備註（選填）</label><input class="inp" id="ceS" value="${esc(orig.s || "")}" placeholder="例如：(未明示部位者)"></div>`}`;

  const syncRows = () => {
    document.querySelectorAll("#ceRows .row3").forEach(r => {
      const i = +r.dataset.i;
      r.querySelectorAll("[data-f]").forEach(inp => rows[i][inp.dataset.f] = inp.value);
    });
  };
  const paint = () => {
    $("#mpBody").innerHTML = body();
    document.querySelectorAll("#ceType .mini").forEach(b => b.onclick = () => { if (multi) { orig.t = $("#ceT")?.value; syncRows(); } multi = b.dataset.m === "1"; paint(); });
    $("#ceAddRow")?.addEventListener("click", () => { syncRows(); rows.push({ l: "次", c: "", n: "" }); paint(); });
    document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { syncRows(); rows.splice(+b.dataset.del, 1); paint(); });
  };

  const save = () => {
    let card;
    if (multi) {
      syncRows();
      const t = $("#ceT").value.trim();
      const rs = rows.map(r => ({ l: r.l.trim(), c: r.c.trim(), n: r.n.trim() })).filter(r => r.c);
      if (!t || !rs.length) return alert("請填標題，並至少一列代碼");
      card = { t, rows: rs };
    } else {
      const c = $("#ceC").value.trim(), n = $("#ceN").value.trim(), s = $("#ceS").value.trim();
      if (!c) return $("#ceC").focus();
      card = { c, n }; if (s) card.s = s;
    }
    if (isNew) sec.cards.push(card); else sec.cards[ci] = card;
    closeModal(); persist();
  };
  const shift = d => {
    const j = ci + d; if (j < 0 || j >= sec.cards.length) return;
    [sec.cards[ci], sec.cards[j]] = [sec.cards[j], sec.cards[ci]]; closeModal(); persist();
  };

  openModal(isNew ? `＋ 新增小卡（${sec.title}）` : "✏️ 編輯小卡", "", [
    ...(!isNew ? [
      { t: "🗑 刪除", danger: true, fn: () => { if (confirm("刪除這張小卡？")) { sec.cards.splice(ci, 1); closeModal(); persist(); } } },
      { t: "◀ 前移", fn: () => shift(-1) }, { t: "後移 ▶", fn: () => shift(1) }] : []),
    { t: "取消", fn: closeModal }, { t: "儲存", pri: true, fn: save }
  ]);
  paint();
}

/* ───────── 字級、搜尋、按鈕 ───────── */
function showToast(code) {
  const toast = $("#toast");
  toast.innerText = `已複製病代: ${code}`;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1000);
}
function applyFontSize(size) {
  document.documentElement.style.setProperty("--fs-card", size + "px");
  fontVal.textContent = size + "px";
}
try { const f = localStorage.getItem("fontSize"); if (f) fontSlider.value = f; } catch(e){}
fontSlider.addEventListener("input", e => { applyFontSize(e.target.value); try { localStorage.setItem("fontSize", e.target.value); } catch(err){} });

$("#searchInput").addEventListener("input", e => { keyword = e.target.value; render(); });

const backToTopBtn = $("#backToTopBtn");
window.addEventListener("scroll", () => backToTopBtn.classList.toggle("show", window.scrollY > 400));
backToTopBtn.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));

const searchToggleBtn = $("#searchToggleBtn"), searchFloatPanel = $("#searchFloatPanel"), searchInputEl = $("#searchInput");
function openSearchPanel() { searchFloatPanel.classList.add("show"); searchToggleBtn.classList.add("active"); setTimeout(() => searchInputEl.focus(), 150); }
function closeSearchPanel() { searchFloatPanel.classList.remove("show"); searchToggleBtn.classList.remove("active"); }
searchToggleBtn.addEventListener("click", e => { e.stopPropagation(); searchFloatPanel.classList.contains("show") ? closeSearchPanel() : openSearchPanel(); });
searchFloatPanel.addEventListener("click", e => e.stopPropagation());

const settingsBtn = $("#settingsBtn"), settingsPanel = $("#settingsPanel");
settingsBtn.addEventListener("click", e => { e.stopPropagation(); settingsPanel.classList.toggle("show"); });
settingsPanel.addEventListener("click", e => e.stopPropagation());
document.addEventListener("click", () => { closeSearchPanel(); settingsPanel.classList.remove("show"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { closeSearchPanel(); settingsPanel.classList.remove("show"); closeModal(); } });

/* ───────── 與 Portal 共用主題／字型／卡片／材質 ───────── */
const THEME_KEYS = ["cz_theme_v7", "cz_theme_v6"], THEME_WRITE = "cz_theme_v7", CFG_KEYS = ["cz_cfg_v7", "cz_cfg_v6"];
const THEME_ORDER = ["clinic", "rose", "ocean", "ash", "light"];
const THEME_LABEL = { clinic:"藥草綠", rose:"玫瑰花園", ocean:"深海航線", ash:"雅灰", light:"明亮" };
const THEME_SWATCH = { clinic:["#f5efdf","#2f7d68","#d9604c"], rose:["#f8e7e1","#b0585c","#e3a14a"], ocean:["#e0ecf4","#2f6fa3","#e7a03d"], ash:["#EAE6DC","#3E4C6E","#c98a3f"], light:["#EDF2F7","#2C5F8A","#e0573f"] };
const VALID_FONTS = ["sans","pingfang","maru","serif","wenkai","goround","sourcesans","sourceserif"], VALID_CARDS = ["solid","flat","glass","ios"], VALID_TEX = ["none","dots","grid"];
function lsGet(keys) { for (const k of keys) { try { const v = localStorage.getItem(k); if (v) return v; } catch(e){} } return null; }
function applyTheme(t) {
  if (!THEME_ORDER.includes(t)) t = "clinic";
  document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll(".theme-swatch").forEach(b => b.classList.toggle("on", b.dataset.themeId === t));
}
function applyPortalCfg() {
  try {
    const cfg = JSON.parse(lsGet(CFG_KEYS) || "{}"), root = document.documentElement;
    if (cfg.font && VALID_FONTS.includes(cfg.font)) root.setAttribute("data-font", cfg.font);
    if (cfg.card && VALID_CARDS.includes(cfg.card)) root.setAttribute("data-card", cfg.card);
    if (cfg.tex && VALID_TEX.includes(cfg.tex)) root.setAttribute("data-texture", cfg.tex);
  } catch(e){}
}
(function () {
  const wrap = $("#themeTogs");
  THEME_ORDER.forEach(id => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "theme-swatch"; b.dataset.themeId = id;
    b.innerHTML = `<span class="dots">${THEME_SWATCH[id].map(c => `<i style="background:${c}"></i>`).join("")}</span><b>${THEME_LABEL[id]}</b>`;
    b.onclick = () => { applyTheme(id); try { localStorage.setItem(THEME_WRITE, id); } catch(e){} };
    wrap.appendChild(b);
  });
  applyTheme(lsGet(THEME_KEYS) || "clinic"); applyPortalCfg();
})();
window.addEventListener("storage", e => {
  if (THEME_KEYS.includes(e.key)) applyTheme(e.newValue);
  if (CFG_KEYS.includes(e.key)) applyPortalCfg();
});

/* ───────── 複製 ───────── */
function copyText(code) {
  const done = () => showToast(code);
  const fail = () => {
    const t = $("#toast"); t.innerText = "⚠️ 複製失敗，請手動輸入：" + code; t.classList.add("show");
    clearTimeout(showToast._t); showToast._t = setTimeout(() => t.classList.remove("show"), 2500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done).catch(() => legacyCopy(code) ? done() : fail());
  else legacyCopy(code) ? done() : fail();
}
function legacyCopy(text) {
  try {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand("copy"); document.body.removeChild(ta); return ok;
  } catch(e) { return false; }
}

buildQuickNav();
render();
if (sessionStorage.getItem("icd_edit") === "1" || localStorage.getItem("icd_edit") === "1") { /* 需要時再手動解鎖，避免誤觸 */ }
initStore();

</script>
