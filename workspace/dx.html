<!DOCTYPE html>
<html lang="zh-Hant" data-theme="clinic" data-card="solid" data-font="sans" data-texture="none">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow">
<title>門診病代速查 v6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=LXGW+WenKai+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Chiron+GoRound+TC:wght@500;700;900&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════
   門診病代速查 v6 — 與「中正診所 Portal」同一套風格
   暖紙 × 粗墨線框 × 硬陰影 × 資料夾分頁標籤 × 斜紋繃帶條
   主題／字型／卡片樣式／背景材質 皆與 Portal 共用設定
   （localStorage：cz_theme_v7、cz_cfg_v7，需同一網域才會同步）
═══════════════════════════════════════════════════════════ */
:root{
  --lw: 2.5px;
  --r: 16px;
  --fs-card: 16px;   /* 診間字體大小滑桿 */
  --A:#2f7d68; --A2:#4fa088; --Alt:#d9604c;
  --bg:#f5efdf; --surf:#fffdf4; --surf2:#fbf6e4; --border:#d8cfae;
  --line:#25382f; --pop:#25382f;
  --shadow:rgba(37,56,47,.10); --shadowH:rgba(37,56,47,.22);
  --text:#25382f; --sub:#2f7d68; --muted:#7a7a62;
  --warnBg:#FFF3B8; --hdr:#fffdf4; --note:#ffe98a;
}
[data-theme="clinic"]{
  --A:#2f7d68; --A2:#4fa088; --Alt:#d9604c;
  --bg:#f5efdf; --surf:#fffdf4; --surf2:#fbf6e4; --border:#d8cfae;
  --line:#25382f; --pop:#25382f; --text:#25382f; --sub:#2f7d68; --muted:#7a7a62; --hdr:#fffdf4;
}
[data-theme="rose"]{
  --A:#b0585c; --A2:#d07f80; --Alt:#e3a14a;
  --bg:#f8e7e1; --surf:#fff8f4; --surf2:#fbeae4; --border:#e8c6bb;
  --line:#432727; --pop:#432727; --text:#432727; --sub:#b0585c; --muted:#9a7c72; --hdr:#fff8f4;
}
[data-theme="ocean"]{
  --A:#2f6fa3; --A2:#5a96c6; --Alt:#e7a03d;
  --bg:#e0ecf4; --surf:#f8fbfe; --surf2:#e8f1f8; --border:#c4d9e8;
  --line:#1b3247; --pop:#1b3247; --text:#1b3247; --sub:#2f6fa3; --muted:#6f8aa0; --hdr:#f8fbfe;
}
[data-theme="light"]{
  --A:#2C5F8A; --A2:#3A7AB5; --Alt:#e0573f;
  --bg:#EDF2F7; --surf:#FFFFFF; --surf2:#F0F5FA; --border:#C8D9EC;
  --line:#16293b; --pop:#16293b; --text:#16293b; --sub:#2C5F8A; --muted:#5A7FA0; --hdr:#FFFFFF;
}
[data-theme="ash"]{
  --A:#3E4C6E; --A2:#6577a0; --Alt:#c98a3f;
  --bg:#EAE6DC; --surf:#F8F6F0; --surf2:#EFEBE1; --border:#D3CDBB;
  --line:#22232b; --pop:#22232b; --text:#22232b; --sub:#3E4C6E; --muted:#7c766a; --hdr:#F8F6F0;
}

[data-font="pingfang"]{ --ff:"PingFang TC","Noto Sans TC",sans-serif; }
[data-font="sans"],[data-font="sourcesans"]{ --ff:"Noto Sans TC","PingFang TC",sans-serif; }
[data-font="serif"],[data-font="sourceserif"]{ --ff:"Noto Serif TC",serif; }
[data-font="wenkai"]{ --ff:"LXGW WenKai TC","Noto Serif TC",serif; }
[data-font="goround"]{ --ff:"Chiron GoRound TC","Noto Sans TC",sans-serif; }
[data-font="maru"]{ --ff:"Zen Maru Gothic","Noto Sans TC",sans-serif; }

/* 背景材質（跟 Portal 設定） */
[data-texture="dots"] body::after{opacity:1;background-image:radial-gradient(circle,color-mix(in srgb,var(--line) 22%,transparent) 1.2px,transparent 1.6px);background-size:22px 22px;}
[data-texture="grid"] body::after{opacity:1;background-image:linear-gradient(color-mix(in srgb,var(--line) 12%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--line) 12%,transparent) 1px,transparent 1px);background-size:32px 32px;}
[data-texture="none"] body::after{opacity:0;}

/* 卡片樣式（跟 Portal 設定） */
[data-card="flat"] .card{box-shadow:none;}
[data-card="flat"] .card:hover{box-shadow:0 0 0 var(--lw) var(--A);transform:none;}
[data-card="glass"] .card{background:color-mix(in srgb,var(--surf) 68%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 24px var(--shadow);}
[data-card="ios"] .card{background:color-mix(in srgb,var(--surf) 52%,transparent);backdrop-filter:saturate(180%) blur(26px);-webkit-backdrop-filter:saturate(180%) blur(26px);box-shadow:0 10px 30px var(--shadow);border-color:color-mix(in srgb,var(--line) 55%,transparent);}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:auto;}
body{
  min-height:100vh;background:var(--bg);color:var(--text);
  font-family:var(--ff,"Noto Sans TC",sans-serif);
  font-size:18px;line-height:1.6;letter-spacing:.02em;
  overflow-x:hidden;transition:background .3s,color .3s;
}
/* 紙張橫格線＋柔光 */
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,transparent 0 35px,color-mix(in srgb,var(--line) 7%,transparent) 35px 36px),
    radial-gradient(ellipse 60% 45% at 100% 0%,color-mix(in srgb,var(--A) 10%,transparent),transparent 70%),
    radial-gradient(ellipse 50% 40% at 0% 100%,color-mix(in srgb,var(--Alt) 9%,transparent),transparent 70%);}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .3s;}
button,input{font-family:inherit;}
::selection{background:var(--Alt);color:#fff;}

/* ───────── 表頭＋斜紋繃帶條 ───────── */
.hdr{
  position:relative;z-index:2;margin-bottom:14px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 96px 18px 28px;
  background:var(--hdr);border-bottom:var(--lw) solid var(--line);
}
.hdr::after{content:'';position:absolute;left:0;right:0;bottom:calc(-1 * var(--lw) - 9px);height:9px;border-bottom:var(--lw) solid var(--line);
  background:repeating-linear-gradient(-45deg,var(--A) 0 9px,var(--surf) 9px 18px);}
.logo{display:flex;align-items:center;gap:14px;min-width:0;}
.logo-icon{flex:none;width:54px;height:54px;border-radius:14px;background:var(--A);border:var(--lw) solid var(--line);display:flex;align-items:center;justify-content:center;box-shadow:4px 4px 0 var(--pop);transform:rotate(-5deg);}
.logo-icon svg{width:30px;height:30px;display:block;}
.logo-name{font-size:clamp(24px,3vw,30px);font-weight:900;letter-spacing:.06em;line-height:1.15;}
.logo-sub{display:inline-block;font-family:"Inter",monospace;font-size:11px;font-weight:900;letter-spacing:3px;color:#fff;background:var(--Alt);padding:1px 8px 1px 10px;margin-top:4px;border-radius:4px;transform:rotate(-1.5deg);}
.hint-note{
  flex:none;background:var(--note);color:#2b2a1c;border:var(--lw) solid var(--line);
  border-radius:6px 6px 14px 6px;padding:9px 16px;font-size:15px;font-weight:800;
  box-shadow:4px 4px 0 var(--pop);transform:rotate(1.5deg);position:relative;
}
.hint-note::before{content:'';position:absolute;top:-11px;left:50%;width:56px;height:18px;transform:translateX(-50%) rotate(-3deg);
  background:color-mix(in srgb,var(--A) 40%,transparent);border:2px solid color-mix(in srgb,var(--line) 45%,transparent);}

/* ───────── 吸附：快速跳轉 ───────── */
.sticky-wrap{
  position:sticky;top:0;z-index:600;
  background:var(--hdr);
  border-top:var(--lw) solid var(--line);border-bottom:var(--lw) solid var(--line);
  padding:10px 90px 12px 28px;margin-top:14px;
  box-shadow:0 5px 0 color-mix(in srgb,var(--pop) 14%,transparent);
}
.quicknav-label{display:inline-block;align-self:center;font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--Alt);
  border:2px double var(--Alt);border-radius:6px;padding:0 10px 0 12px;margin:0 4px 0 2px;transform:rotate(-1.5deg);background:var(--surf);}
.quicknav{display:flex;flex-wrap:wrap;gap:9px;}
.quicknav-btn{
  background:var(--surf);color:var(--text);border:2px solid var(--line);border-radius:10px;
  font-size:19px;font-weight:900;letter-spacing:.04em;padding:5px 15px 6px;cursor:pointer;white-space:nowrap;
  box-shadow:3px 3px 0 var(--pop);transition:transform .1s,box-shadow .1s,background .15s,color .15s;
}
.quicknav-btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--A);background:color-mix(in srgb,var(--A) 14%,var(--surf));}
.quicknav-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--pop);}
.quicknav-btn.quicknav-special{background:var(--Alt);color:#fff;}
.quicknav-btn.quicknav-special:hover{box-shadow:4px 4px 0 var(--pop);filter:brightness(1.06);}

/* ───────── 主體 ───────── */
.container-wrap{position:relative;z-index:1;max-width:1520px;margin:0 auto;padding:10px 28px 40px;}
.section{margin-bottom:12px;}

/* 區塊標籤：資料夾分頁 */
.sec-label{display:flex;align-items:flex-end;margin:38px 0 22px;user-select:none;}
.section:first-child .sec-label{margin-top:24px;}
.sec-pill{position:relative;display:flex;align-items:center;gap:8px;background:var(--A);color:#fff;
  font-size:18px;font-weight:900;padding:9px 20px 8px;letter-spacing:.12em;
  border:var(--lw) solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.12);}
.sec-pill::after{content:'';position:absolute;left:0;right:0;bottom:calc(-1 * var(--lw));height:var(--lw);background:var(--A);}
.sec-line{flex:1;height:0;border-bottom:var(--lw) solid var(--line);}
.section.special .sec-pill{background:var(--Alt);}
.section.special .sec-pill::after{background:var(--Alt);}

/* 卡片：索引卡 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px 22px;counter-reset:cardno;padding-top:6px;}
.card{
  position:relative;background:var(--surf);border:var(--lw) solid var(--line);border-radius:var(--r);
  box-shadow:5px 5px 0 var(--pop);cursor:pointer;
  padding:32px 16px 18px;min-height:112px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;
  counter-increment:cardno;
  transition:transform .15s cubic-bezier(.3,1.5,.5,1),box-shadow .15s;
}
.anim .card{animation:cardIn .4s cubic-bezier(.3,1.4,.5,1) both;}
.anim .card:nth-child(2){animation-delay:.03s}.anim .card:nth-child(3){animation-delay:.06s}.anim .card:nth-child(4){animation-delay:.09s}
.anim .card:nth-child(n+5){animation-delay:.12s}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) rotate(-1deg)}to{opacity:1;transform:none}}
.card::before{content:"№ " counter(cardno,decimal-leading-zero);position:absolute;top:9px;left:14px;font-family:"Inter",monospace;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--muted);}
.card::after{content:'';position:absolute;top:10px;right:14px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--line);box-shadow:inset 1px 1px 0 rgba(0,0,0,.18);}
.card:hover{transform:translate(-3px,-3px) rotate(-.4deg);box-shadow:8px 8px 0 var(--A);}
.card:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--pop);}
.card.hl{background:var(--warnBg);}
.section.special .card:hover{box-shadow:8px 8px 0 var(--Alt);}

.code{
  font-family:"Inter","Noto Sans TC",monospace;
  font-weight:900;color:var(--A);font-size:calc(var(--fs-card) + 4px);letter-spacing:.04em;line-height:1.2;word-break:break-all;
}
.section.special .code{color:var(--Alt);}
.name{
  width:100%;padding-top:9px;border-top:2px dashed color-mix(in srgb,var(--line) 35%,transparent);
  font-size:var(--fs-card);font-weight:800;color:var(--text);line-height:1.4;word-break:break-word;
}
.small-note{display:block;margin-top:3px;font-size:85%;font-weight:600;color:var(--muted);}
.empty{text-align:center;padding:40px;color:var(--muted);font-weight:800;border:2px dashed color-mix(in srgb,var(--line) 40%,transparent);border-radius:14px;margin-top:24px;}

/* ───────── 浮動按鈕 ───────── */
.ctrl{
  position:fixed;width:54px;height:54px;border-radius:14px;border:var(--lw) solid var(--line);background:var(--surf);color:var(--text);
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:4px 4px 0 var(--pop);transition:transform .12s,box-shadow .12s,background .15s,opacity .25s;
}
.ctrl:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--A);}
.ctrl:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--pop);}
.ctrl.active{background:var(--A);color:#fff;}
#searchToggleBtn{top:22px;right:24px;z-index:1100;}
#settingsBtn{right:24px;bottom:24px;z-index:1000;}
#backToTopBtn{left:24px;bottom:24px;z-index:1000;opacity:0;pointer-events:none;}
#backToTopBtn.show{opacity:1;pointer-events:auto;}

/* 展開式搜尋 */
.search-float-panel{position:fixed;top:22px;right:92px;width:min(440px,calc(100vw - 120px));z-index:1090;
  opacity:0;visibility:hidden;transform:translateX(14px);pointer-events:none;transition:opacity .2s,transform .2s,visibility .2s;}
.search-float-panel.show{opacity:1;visibility:visible;transform:none;pointer-events:auto;}
.search{
  width:100%;height:54px;padding:0 18px;border:var(--lw) solid var(--line);border-radius:12px;
  background:var(--surf);color:var(--text);font-size:17px;font-weight:700;
  box-shadow:3px 3px 0 var(--pop);transition:box-shadow .15s,transform .15s;
}
.search::placeholder{color:var(--muted);font-weight:600;}
.search:focus{outline:none;transform:translate(-1px,-1px);box-shadow:5px 5px 0 var(--A);}

/* 設定面板：便條卡 */
.settings-panel{
  position:fixed;right:24px;bottom:94px;width:min(320px,calc(100vw - 48px));z-index:999;
  background:var(--surf2);border:var(--lw) solid var(--line);border-radius:14px;box-shadow:6px 6px 0 var(--pop);
  padding:24px 18px 18px;display:none;
}
.settings-panel.show{display:block;animation:cardIn .25s both;}
.panel-tag{position:absolute;top:-15px;left:14px;font-size:13px;font-weight:900;color:#fff;background:var(--Alt);border:2px solid var(--line);border-radius:8px;padding:2px 12px;letter-spacing:.12em;transform:rotate(-1.5deg);}
.setting-title{font-size:15px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin:4px 0 8px;}
.srow{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
.srow input[type=range]{flex:1;accent-color:var(--A);height:6px;cursor:pointer;}
.sval{font-size:13px;font-weight:900;min-width:48px;text-align:center;color:var(--text);background:var(--surf);border:2px solid var(--line);border-radius:8px;padding:1px 4px;}
.theme-swatches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
.theme-swatch{
  display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:10px 12px 9px;text-align:left;
  border-radius:12px;border:2px solid var(--line);background:var(--surf);cursor:pointer;color:var(--text);
  box-shadow:3px 3px 0 var(--pop);transition:transform .12s,box-shadow .12s,background .15s;appearance:none;-webkit-appearance:none;
}
.theme-swatch:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--pop);}
.theme-swatch:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--pop);}
.theme-swatch.on{background:color-mix(in srgb,var(--A) 14%,var(--surf));box-shadow:3px 3px 0 var(--A);}
.theme-swatch .dots{display:flex;gap:6px;}
.theme-swatch .dots i{width:20px;height:20px;border-radius:50%;display:block;border:2px solid var(--line);}
.theme-swatch b{font-size:13px;font-weight:800;letter-spacing:.03em;line-height:1.2;}

/* 複製提示 */
.toast{
  position:fixed;bottom:96px;left:50%;transform:translateX(-50%);z-index:1200;
  background:var(--A);color:#fff;border:var(--lw) solid var(--line);border-radius:12px;
  padding:12px 26px;font-size:17px;font-weight:900;letter-spacing:.06em;box-shadow:4px 4px 0 var(--pop);
  opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s;white-space:nowrap;
}
.toast.show{opacity:1;bottom:106px;}

.footer-space{height:70px;}

@media(max-width:700px){
  .hdr{padding:14px 78px 14px 14px;}
  .hint-note{display:none;}
  .logo-icon{width:46px;height:46px;}
  .logo-name{font-size:23px;white-space:nowrap;}
  .sticky-wrap{padding:8px 74px 10px 14px;}
  .quicknav{gap:7px;}
  .quicknav-btn{font-size:17px;padding:4px 11px 5px;border-radius:9px;box-shadow:2px 2px 0 var(--pop);}
  .container-wrap{padding:6px 14px 30px;}
  .grid{gap:20px 16px;}
  .search-float-panel{right:84px;width:calc(100vw - 104px);}
  #searchToggleBtn{right:14px;}
  .toast{max-width:calc(100vw - 28px);white-space:normal;text-align:center;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">
    <div class="logo-icon"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M12 3h8v9h9v8h-9v9h-8v-9H3v-8h9z" fill="#fffdf4" stroke="#25382f" stroke-width="2.4" stroke-linejoin="round"/></svg></div>
    <div>
      <div class="logo-name">門診病代速查</div>
      <div class="logo-sub">ICD-10 QUICK REF · V6</div>
    </div>
  </div>
  <div class="hint-note">👍 點擊卡片即可快速複製病代</div>
</header>

<button class="ctrl" id="searchToggleBtn" title="搜尋" aria-label="搜尋">🔍</button>
<div class="search-float-panel" id="searchFloatPanel">
  <input type="text" class="search" id="searchInput" placeholder="輸入疾病名稱或 ICD 代碼搜尋..." autocomplete="off" />
</div>

<div class="sticky-wrap">
  <div class="quicknav" id="quickNav"></div>
</div>

<div class="container-wrap">
  <div id="container"></div>
</div>

<div class="toast" id="toast">已複製病代</div>

<button class="ctrl" id="backToTopBtn" title="回到最上方" aria-label="回到最上方">⬆️</button>
<button class="ctrl" id="settingsBtn" title="設定" aria-label="設定">⚙️</button>

<div class="settings-panel" id="settingsPanel">
  <div class="panel-tag">設定</div>
  <div class="setting-title">🔧 診間字體大小</div>
  <div class="srow">
    <input type="range" min="14" max="40" value="16" id="fontSlider" />
    <span class="sval" id="fontVal">16px</span>
  </div>
  <div class="setting-title">🎨 佈景主題（與 Portal 同步）</div>
  <div class="theme-swatches" id="themeTogs"></div>
</div>

<div class="footer-space"></div>

<script>
const data = {

"🦴 M00 關節痛 (一般)":[
  ["M2550","關節痛"],
  ["M5450","下背痛"],
  ["M549","背痛"],
  ["S335XXA","腰椎扭傷拉傷初期照護"]
],

"🦺 M01 肩部關節痛":[
  ["M25511","右側肩部關節痛"],
  ["M25512","左側肩部關節痛"],
  ["M25519","未明示側性肩部關節痛"]
],

"🦾 M02 肘部關節痛":[
  ["M25521","右側肘部關節痛"],
  ["M25522","左側肘部關節痛"],
  ["M25529","未明示側性肘部關節痛"]
],

"⌚ M03 腕部關節痛":[
  ["M25531","右側腕部關節痛"],
  ["M25532","左側腕部關節痛"],
  ["M25539","未明示側性腕部關節痛"]
],

"🩲 M04 髖部關節痛":[
  ["M25551","右側髖部關節痛"],
  ["M25552","左側髖部關節痛"],

const container  = document.getElementById("container");
const fontSlider = document.getElementById("fontSlider");
const fontVal    = document.getElementById("fontVal");
const sectionKeys = Object.keys(data);
let firstRender = true;

function stripTags(s){ return s.replace(/<[^>]*>/g, ""); }

function render(keyword=""){
  container.innerHTML = "";
  /* 只有第一次載入播放卡片進場動畫，搜尋打字時不閃爍 */
  container.className = firstRender ? "anim" : "";
  firstRender = false;

  /* 搜尋 S93.401A 這種帶小數點的輸入，也能找到 S93401A */
  const kw = keyword.trim().toLowerCase();
  const kwNoDot = kw.replace(/\./g, "");
  let total = 0;

  sectionKeys.forEach((section, idx) => {
    const filtered = data[section].filter(item => {
      if (!kw) return true;
      const code = item[0].toLowerCase();
      const name = stripTags(item[1]).toLowerCase();
      return code.includes(kw) || code.includes(kwNoDot) || name.includes(kw);
    });
    if (filtered.length === 0) return;
    total += filtered.length;

    const isSpecial = section.includes("常用新舊代碼") || section.includes("常用扭傷");
    const isHot     = section.includes("常用扭傷");

    const sec = document.createElement("div");
    sec.id = "sec-" + idx;
    sec.className = "section" + (isSpecial ? " special" : "");
    sec.innerHTML = `
      <div class="sec-label"><div class="sec-pill">${section}</div><div class="sec-line"></div></div>
      <div class="grid"></div>
    `;
    const grid = sec.querySelector(".grid");

    filtered.forEach(item => {
      const card = document.createElement("div");
      card.className = "card" + (isHot ? " hl" : "");
      card.innerHTML = `
        <div class="code">${item[0]}</div>
        <div class="name">${item[1]}</div>
      `;
      card.onclick = () => {
        let cleanCode = item[0];
        if (cleanCode.includes("]")) cleanCode = cleanCode.split("]").pop().trim();
        copyText(cleanCode);
      };
      grid.appendChild(card);
    });
    container.appendChild(sec);
  });

  if (total === 0) {
    container.innerHTML = '<div class="empty">找不到符合的病代，換個關鍵字試試</div>';
  }
  applyFontSize(fontSlider.value);
}

function showToast(code){
  const toast = document.getElementById("toast");
  toast.innerText = `已複製病代: ${code}`;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1000);
}

function applyFontSize(size){
  document.documentElement.style.setProperty("--fs-card", size + "px");
  fontVal.textContent = size + "px";
}

try { const savedFont = localStorage.getItem("fontSize"); if (savedFont) fontSlider.value = savedFont; } catch(e){}

fontSlider.addEventListener("input", (e) => {
  applyFontSize(e.target.value);
  try { localStorage.setItem("fontSize", e.target.value); } catch(err){}
});

/* 快速跳轉 */
function buildQuickNav(){
  const nav = document.getElementById("quickNav");
  nav.innerHTML = '<div class="quicknav-label">⚡ 快速跳轉</div>';
  quickNavConfig.forEach(cfg => {
    const idx = sectionKeys.findIndex(k => k.includes(cfg.match));
    if (idx === -1) return;
    const btn = document.createElement("button");
    btn.className = "quicknav-btn" + (cfg.special ? " quicknav-special" : "");
    btn.innerText = cfg.label;
    btn.onclick = () => jumpToSection(idx);
    nav.appendChild(btn);
  });
}

function jumpToSection(idx){
  const searchInput = document.getElementById("searchInput");
  if (searchInput.value) { searchInput.value = ""; render(); }
  closeSearchPanel();
  setTimeout(() => {
    const el = document.getElementById("sec-" + idx);
    if (!el) return;
    const stickyEl = document.querySelector(".sticky-wrap");
    const offset = (stickyEl ? stickyEl.offsetHeight : 0) + 14;
    const targetY = window.pageYOffset + el.getBoundingClientRect().top - offset;
    window.scrollTo({ top: Math.max(targetY, 0), behavior: "smooth" });
  }, 60);
}

/* ===================================================
   主題／字型／卡片樣式／材質：與中正診所 Portal 共用設定
   ‧ 主題：localStorage「cz_theme_v7」（相容舊 v6）
   ‧ 字型、卡片、材質：讀「cz_cfg_v7」
   ‧ localStorage 以網域為單位，兩頁需在同一網域才會同步
   =================================================== */
const THEME_KEYS  = ["cz_theme_v7", "cz_theme_v6"];
const THEME_WRITE = "cz_theme_v7";
const CFG_KEYS    = ["cz_cfg_v7", "cz_cfg_v6"];
const THEME_ORDER = ["clinic", "rose", "ocean", "ash", "light"];
const THEME_LABEL = { clinic:"藥草綠", rose:"玫瑰花園", ocean:"深海航線", ash:"雅灰", light:"明亮" };
const THEME_SWATCH = {
  clinic:["#f5efdf","#2f7d68","#d9604c"],
  rose:  ["#f8e7e1","#b0585c","#e3a14a"],
  ocean: ["#e0ecf4","#2f6fa3","#e7a03d"],
  ash:   ["#EAE6DC","#3E4C6E","#c98a3f"],
  light: ["#EDF2F7","#2C5F8A","#e0573f"]
};
const VALID_FONTS = ["sans","pingfang","maru","serif","wenkai","goround","sourcesans","sourceserif"];
const VALID_CARDS = ["solid","flat","glass","ios"];
const VALID_TEX   = ["none","dots","grid"];

function lsGet(keys){
  for (const k of keys) { try { const v = localStorage.getItem(k); if (v) return v; } catch(e){} }
  return null;
}

function applyTheme(t){
  if (!THEME_ORDER.includes(t)) t = "clinic";   // 舊的 夜間／仿舊／暗金 會回到藥草綠
  document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll(".theme-swatch").forEach(b => b.classList.toggle("on", b.dataset.themeId === t));
}

function applyPortalCfg(){
  try {
    const cfg = JSON.parse(lsGet(CFG_KEYS) || "{}");
    const root = document.documentElement;
    if (cfg.font && VALID_FONTS.includes(cfg.font)) root.setAttribute("data-font", cfg.font);
    if (cfg.card && VALID_CARDS.includes(cfg.card)) root.setAttribute("data-card", cfg.card);
    if (cfg.tex  && VALID_TEX.includes(cfg.tex))    root.setAttribute("data-texture", cfg.tex);
  } catch (e) { /* 保持預設 */ }
}

(function buildThemeButtons(){
  const wrap = document.getElementById("themeTogs");
  THEME_ORDER.forEach(id => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "theme-swatch";
    b.dataset.themeId = id;
    b.innerHTML = `<span class="dots">${THEME_SWATCH[id].map(c => `<i style="background:${c}"></i>`).join("")}</span><b>${THEME_LABEL[id]}</b>`;
    b.onclick = () => {
      applyTheme(id);
      try { localStorage.setItem(THEME_WRITE, id); } catch(e){}
    };
    wrap.appendChild(b);
  });
  applyTheme(lsGet(THEME_KEYS) || "clinic");
  applyPortalCfg();
})();

window.addEventListener("storage", (e) => {
  if (THEME_KEYS.includes(e.key)) applyTheme(e.newValue);
  if (CFG_KEYS.includes(e.key))   applyPortalCfg();
});

/* 複製病代（含舊瀏覽器 fallback 與失敗提示） */
function copyText(code){
  const done = () => showToast(code);
  const fail = () => {
    const toast = document.getElementById("toast");
    toast.innerText = "⚠️ 複製失敗，請手動輸入：" + code;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 2500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(done).catch(() => legacyCopy(code) ? done() : fail());
  } else {
    legacyCopy(code) ? done() : fail();
  }
}
function legacyCopy(text){
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}
