<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F1E4">
<title>小怪獸咖啡館 · 後台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
/* ---------- 預設配色：拿鐵奶油 ---------- */
:root{
  --bg:#F5F1E4; --dot:#E6DDC7; --card:#FFFCF3; --card-edge:#D9CDB0; --card-under:#DDE3CE;
  --ink:#453A28; --ink-soft:#8A7B5C; --ink-faint:#B6A886;
  --accent:#5F9E6E; --accent-dk:#477F58; --accent-pale:#E3EFDD; --on-accent:#FFFFFF;
  --input-bg:#FBF7EA; --danger:#D4826A; --danger-dk:#B36249; --scrim:#3A3223;
  --fs:19px;
  --font:'Zen Maru Gothic','Noto Sans TC','PingFang TC',sans-serif;
  --monster:#8C6FC6; --monster-dk:#6B4FA6; --monster-eye:#FFFDF6;
}

/* ---------- 其他配色 ---------- */
[data-theme="coin"]{
  --bg:#E9EAEC; --dot:#D6D8DB; --card:#FEFEFE; --card-edge:#CBCED2; --card-under:#B7BBC0;
  --ink:#262A2E; --ink-soft:#6E747A; --ink-faint:#A0A6AC;
  --accent:#5B6B7A; --accent-dk:#44515E; --accent-pale:#DEE4E9; --on-accent:#FFFFFF;
  --input-bg:#F5F6F7; --danger:#B4574B; --danger-dk:#8E4136; --scrim:#2A2F34;
}
[data-theme="lucky"]{
  --bg:#F2E4E0; --dot:#E2CFCA; --card:#FFFAF8; --card-edge:#E0C9C3; --card-under:#CFB2AB;
  --ink:#33201C; --ink-soft:#7B6259; --ink-faint:#AE9088;
  --accent:#C0392B; --accent-dk:#96271B; --accent-pale:#F7DDD7; --on-accent:#FFF7EF;
  --input-bg:#FCF3F0; --danger:#A9791F; --danger-dk:#875D12; --scrim:#3E211B;
}
[data-theme="matcha"]{
  --bg:#EDF1E6; --dot:#DBE2D0; --card:#FCFDF9; --card-edge:#CBD5BC; --card-under:#B7C4A5;
  --ink:#2C3327; --ink-soft:#6E7A63; --ink-faint:#9EAA91;
  --accent:#5FA47A; --accent-dk:#437B5A; --accent-pale:#DEEEE0; --on-accent:#FFFFFF;
  --input-bg:#F6F9F1; --danger:#C4785B; --danger-dk:#A05B41; --scrim:#2C3327;
}
[data-theme="book"]{
  --bg:#E7EBF1; --dot:#D3D9E3; --card:#FCFDFE; --card-edge:#C6CEDB; --card-under:#B0BACA;
  --ink:#222833; --ink-soft:#666F7E; --ink-faint:#98A1B0;
  --accent:#3E5C8C; --accent-dk:#2C446B; --accent-pale:#DCE4F0; --on-accent:#FFFFFF;
  --input-bg:#F4F7FB; --danger:#B05A3E; --danger-dk:#8E432B; --scrim:#222833;
}
[data-theme="rose"]{
  --bg:#EFE3E4; --dot:#DFCFD1; --card:#FEFCFC; --card-edge:#D8C4C6; --card-under:#C6AFB2;
  --ink:#2E2224; --ink-soft:#786A6C; --ink-faint:#A79597;
  --accent:#B37784; --accent-dk:#8E5766; --accent-pale:#F2DFE2; --on-accent:#FFFFFF;
  --input-bg:#FBF4F5; --danger:#9A5C3C; --danger-dk:#7C462B; --scrim:#3A2A2C;
}
[data-theme="paper"]{
  --bg:#E6DCC8; --dot:#D5C9B1; --card:#F7F1E3; --card-edge:#CFC0A2; --card-under:#BCAB89;
  --ink:#40372A; --ink-soft:#7E7259; --ink-faint:#A99A7C;
  --accent:#7A5C3E; --accent-dk:#5C4229; --accent-pale:#E5D8BE; --on-accent:#FDF8EE;
  --input-bg:#F1E9D8; --danger:#A24B3C; --danger-dk:#84392C; --scrim:#342C20;
}
[data-theme="night"]{
  --bg:#23262B; --dot:#2E333A; --card:#2C3037; --card-edge:#3F454F; --card-under:#171A1E;
  --ink:#EDEAE3; --ink-soft:#A9AEB6; --ink-faint:#767C85;
  --accent:#6FA8CC; --accent-dk:#93C8E6; --accent-pale:#33414C; --on-accent:#16191D;
  --input-bg:#262A30; --danger:#D98A72; --danger-dk:#EEA88F; --scrim:#000000;
}
[data-theme="ink"]{
  --bg:#121212; --dot:#1E1E1E; --card:#1A1A1A; --card-edge:#343434; --card-under:#000000;
  --ink:#F0EDE6; --ink-soft:#A9A399; --ink-faint:#726C63;
  --accent:#C9A227; --accent-dk:#E0BC49; --accent-pale:#3A3220; --on-accent:#14120A;
  --input-bg:#1F1F1F; --danger:#C96A4A; --danger-dk:#E08A6B; --scrim:#000000;
}
[data-theme="sunlit"]{
  --bg:#F8D86B; --dot:#EFC75A; --card:#FFFDF7; --card-edge:#F1BE46; --card-under:#B98226;
  --ink:#4B3527; --ink-soft:#765A43; --ink-faint:#A7865C;
  --accent:#EFAE32; --accent-dk:#C77B18; --accent-pale:#FFF0BB; --on-accent:#3B281B;
  --input-bg:#FFF9E8; --danger:#B9513F; --danger-dk:#873528; --scrim:#4B3527;
}
[data-theme="mono"]{
  --bg:#F1F1EF; --dot:#D9D9D5; --card:#FFFFFF; --card-edge:#BDBDB8; --card-under:#222222;
  --ink:#171717; --ink-soft:#5F5F5B; --ink-faint:#8B8B85;
  --accent:#171717; --accent-dk:#000000; --accent-pale:#E9E9E6; --on-accent:#FFFFFF;
  --input-bg:#FAFAF8; --danger:#8B3529; --danger-dk:#64231C; --scrim:#171717;
}

[data-theme="navy"]{
  --bg:#FAF6EC; --dot:#EDE4CE; --card:#FFFDF7; --card-edge:#E4DBC7; --card-under:#C9BFA0;
  --ink:#34302A; --ink-soft:#78705F; --ink-faint:#A79A82;
  --accent:#3E5C76; --accent-dk:#2C4356; --accent-pale:#E7EEF3; --on-accent:#FFFFFF;
  --input-bg:#FFFEF9; --danger:#C1442D; --danger-dk:#96311E; --scrim:#241F1A;
}
[data-theme="berry"]{
  --bg:#FFFCF5; --dot:#F1E9DA; --card:#FFFFFF; --card-edge:#000000; --card-under:#000000;
  --ink:#1C1C17; --ink-soft:#5C5850; --ink-faint:#948E80;
  --accent:#B23A5B; --accent-dk:#8A2C46; --accent-pale:#FBEAF0; --on-accent:#FFFFFF;
  --input-bg:#FFF8FA; --danger:#A6402E; --danger-dk:#7C2E20; --scrim:#1C1C17;
}

[data-theme="dream"]{
  --bg:#1B1526; --dot:#2A2140; --card:rgba(29,24,44,.72); --card-edge:#3B2F55; --card-under:#0E0A18;
  --ink:#F4EFFF; --ink-soft:#B9A9E0; --ink-faint:#7A6B99;
  --accent:#D8BF8A; --accent-dk:#EBD5A2; --accent-pale:#2E2545; --on-accent:#1B1526;
  --input-bg:#221A33; --danger:#E39; --danger-dk:#F5A; --scrim:#0B0812;
  --monster:#8C6FC6; --monster-dk:#B79BEA; --monster-eye:#FFFDF6;
}
#dreamSky{position:fixed;inset:0;z-index:-3;overflow:hidden;pointer-events:none;opacity:0;
  transition:opacity .5s;background:radial-gradient(circle at 50% 0%,rgba(180,150,255,.16),transparent 42%)}
body[data-theme="dream"] #dreamSky{opacity:1}
#dreamSky .s{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:dreamTw 4s infinite}
@keyframes dreamTw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:1;transform:scale(1.4)}}
#dreamFrame{position:fixed;inset:12px;border:1.5px solid rgba(216,191,138,.42);border-radius:34px;
  z-index:999;pointer-events:none;opacity:0;transition:opacity .5s}
#dreamFrame::before{content:"";position:absolute;inset:11px;border:1px solid rgba(216,191,138,.16);border-radius:26px}
body[data-theme="dream"] #dreamFrame{opacity:1}
.dreamCorner{position:fixed;width:44px;height:44px;z-index:1000;pointer-events:none;opacity:0;transition:opacity .5s;
  color:rgba(216,191,138,.85);font-size:22px;display:grid;place-items:center}
body[data-theme="dream"] .dreamCorner{opacity:1}
.dreamCorner.tl{top:20px;left:20px}.dreamCorner.tr{top:20px;right:20px}
.dreamCorner.bl{bottom:20px;left:20px}.dreamCorner.br{bottom:20px;right:20px}
@media (min-width:900px){.dreamCorner.tl,.dreamCorner.bl{left:216px}}
@media (prefers-reduced-motion:reduce){#dreamSky .s{animation:none}}

/* ---------- 版式與衍生變數：一律寫在 body ----------
   馬卡龍極簡版：陰影改柔霧、去邊框，用 --card-under / --accent-dk 直接出色，沒有新增變數。 */
body{
  --pnl-r:26px; --pnl-bw:0px; --pnl-bs:solid;
  --pnl-sh:0 16px 40px -16px var(--card-under),0 2px 10px -4px var(--card-under);
  --pnl-sh-sm:0 8px 22px -12px var(--card-under);
  --soft-sh:0 6px 18px -10px var(--card-edge);
  --btn-sh:0 10px 24px -10px var(--accent-dk);
  --btn-sh-sm:0 6px 14px -8px var(--accent-dk);
}
body[data-look="bold"]{ --pnl-r:20px; --pnl-sh:0 20px 46px -16px var(--card-under),0 4px 14px -4px var(--card-under); }
body[data-look="dash"]{ --pnl-r:32px; --pnl-sh:0 10px 26px -14px var(--card-under); --pnl-sh-sm:0 6px 16px -10px var(--card-under); }
body[data-look="flat"]{ --pnl-r:14px; --pnl-sh:0 6px 16px -10px var(--card-under); --pnl-sh-sm:0 4px 10px -6px var(--card-under); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);
  line-height:1.7;min-height:100svh;font-size:var(--fs);
  padding:0 16px calc(112px + env(safe-area-inset-bottom));
  transition:background-color .25s,color .25s;
  position:relative;overflow-x:hidden;
}
.wrap{max-width:620px;margin:0 auto;position:relative;z-index:1}
@media (min-width:780px){.wrap{max-width:1000px}}

/* 柔霧光暈：取代原本的圓點紙感背景 */
.blob{position:fixed;border-radius:50%;filter:blur(64px);pointer-events:none;z-index:0}
.blob-a{width:300px;height:300px;top:-70px;left:-80px;background:var(--accent-pale);opacity:.55}
.blob-b{width:340px;height:340px;bottom:-40px;right:-100px;background:var(--monster);opacity:.14}
.blob-c{width:260px;height:260px;top:38%;left:58%;background:var(--accent);opacity:.09}

.card{
  background:var(--card);border:var(--pnl-bw) var(--pnl-bs) var(--card-edge);
  border-radius:var(--pnl-r);box-shadow:var(--pnl-sh);padding:24px 22px;margin-bottom:18px;
}

header{padding:28px 0 6px}
.sign{display:flex;align-items:center;gap:14px}
.brandmark{width:52px;height:52px;flex:0 0 auto;border-radius:50%;
  background:var(--accent-pale);color:var(--accent-dk);
  display:grid;place-items:center;font-size:22px;box-shadow:var(--soft-sh)}
h1{font-size:1.05em;font-weight:700;margin:0;letter-spacing:.02em}
.sub{font-size:.7em;color:var(--ink-soft);margin:0}
.eyebrow{font-size:.65em;font-weight:700;letter-spacing:.14em;color:var(--ink-faint);margin:22px 0 10px;padding-left:2px}

button{font-family:var(--font);font-weight:700;cursor:pointer;border:0}
.btn{background:var(--accent);color:var(--on-accent);font-size:.86em;border-radius:99px;padding:14px 22px;
  box-shadow:var(--btn-sh);transition:transform .18s,box-shadow .18s}
.btn:active{transform:scale(.96);box-shadow:var(--btn-sh-sm)}
.btn:disabled{background:var(--card-edge);box-shadow:none;cursor:not-allowed;color:var(--ink-faint)}
.btn.wide{width:100%}
.btn.soft{background:var(--accent-pale);color:var(--accent-dk);box-shadow:none}
.btn.soft:active{transform:scale(.96)}
.btn.warn{background:var(--danger);box-shadow:0 10px 24px -10px var(--danger-dk);color:#fff}
.btn.tiny{font-size:.74em;padding:10px 20px}
a.btn{display:block;text-align:center;text-decoration:none}

label.fl{display:block;font-weight:700;font-size:.8em;margin:16px 0 6px;color:var(--ink-soft)}
input[type=text],textarea,select{
  width:100%;font-family:var(--font);font-size:.88em;color:var(--ink);
  background:var(--input-bg);border:2px solid transparent;
  border-radius:18px;padding:13px 15px;-webkit-appearance:none;appearance:none;
}
select{font-weight:700;border-radius:18px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat}
textarea{min-height:78px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-pale)}

.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1;min-width:118px}
.center{text-align:center;margin-top:20px}

.cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.cat{font-size:.76em;font-weight:700;padding:9px 16px;border-radius:99px;cursor:pointer;
  background:var(--input-bg);border:2px solid transparent;color:var(--ink-soft);transition:all .18s}
.cat.on{color:#fff;border-color:transparent;box-shadow:var(--btn-sh-sm)}
.cat.on[data-c="全部"]{background:var(--ink);color:var(--bg)}

.toggles{display:flex;gap:10px;margin-top:14px}
.tg{flex:1;text-align:center;background:var(--input-bg);border:2px solid transparent;
  border-radius:18px;padding:12px 6px;font-size:.8em;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:all .18s}
.tg.on{background:var(--accent-pale);border-color:var(--accent);color:var(--accent-dk)}
.tg small{display:block;font-weight:500;font-size:.78em;color:var(--ink-faint)}

.file{display:block;text-align:center;background:var(--input-bg);
  border:2px dashed var(--card-edge);border-radius:20px;padding:24px 12px;
  font-size:.82em;font-weight:700;color:var(--accent-dk);cursor:pointer}
.file input{display:none}
.gauge{height:9px;background:var(--input-bg);border-radius:99px;overflow:hidden;margin-top:12px}
.gauge span{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.gauge.bad span{background:var(--danger)}
.meter{font-size:.72em;color:var(--ink-soft);text-align:center;margin-top:8px}
.meter.bad{color:var(--danger-dk);font-weight:700}

.grid{display:grid;gap:14px}
@media (min-width:780px){.grid{grid-template-columns:repeat(2,1fr)}}
.work{position:relative;background:var(--card);border:var(--pnl-bw) var(--pnl-bs) var(--card-edge);
  border-radius:var(--pnl-r);box-shadow:var(--pnl-sh-sm);
  padding:16px 16px 15px 20px;overflow:hidden;cursor:pointer;transition:transform .2s}
.work:active{transform:scale(.98)}
.work{padding-right:64px}
.work .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:0 4px 4px 0}
.ord{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px}
.ord button{width:38px;height:31px;border-radius:12px;background:var(--input-bg);color:var(--ink-soft);font-size:.72em;line-height:1}
.ord button:active{background:var(--accent-pale);color:var(--accent-dk)}
.work .nm{font-weight:700;font-size:.9em;line-height:1.4}
.work .ds{font-size:.74em;color:var(--ink-soft);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.work .mt{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:.66em;color:var(--ink-faint)}
.chip{font-size:.95em;font-weight:700;padding:3px 11px;border-radius:99px;color:#fff}
.chip.lock{background:var(--monster)}
.chip.open{background:var(--accent)}
.star{color:#C99B45}
.empty{text-align:center;color:var(--ink-faint);font-size:.82em;padding:38px 10px;line-height:2}

.stat{display:flex;gap:10px;margin-top:14px}
.stat div{flex:1;background:var(--input-bg);border-radius:18px;padding:14px 6px;text-align:center}
.stat b{display:block;font-size:1.1em;font-weight:700;color:var(--accent-dk);line-height:1.3}
.stat small{font-size:.62em;color:var(--ink-faint)}

.mcat{display:inline-flex;align-items:center;gap:7px;padding:8px 8px 8px 16px;border-radius:99px;
  color:#fff;font-size:.78em;font-weight:700}
.mcat button{background:rgba(255,255,255,.3);border:0;color:#fff;width:20px;height:20px;
  border-radius:50%;font-size:13px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.mcat button:active{background:rgba(255,255,255,.5)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--card-edge);cursor:pointer}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent-pale)}

/* 外觀 */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.th{background:var(--input-bg);border:2px solid transparent;border-radius:18px;padding:10px 6px;cursor:pointer;text-align:center;transition:all .18s}
.th.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-pale)}
.th .sw{display:flex;justify-content:center;gap:3px;margin-bottom:6px}
.th .sw span{width:15px;height:15px;border-radius:50%}
.th small{font-size:.62em;font-weight:700;color:var(--ink-soft)}
.sizer{display:flex;align-items:center;gap:12px;margin-top:8px}
.sizer button{flex:0 0 auto;width:54px;height:46px;border-radius:16px;background:var(--input-bg);
  color:var(--ink);font-size:.9em}
.sizer button:active{background:var(--accent-pale)}
.sizer .val{flex:1;text-align:center;font-weight:700;color:var(--accent-dk);font-size:.95em}
.looks{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lk{flex:1;min-width:70px;text-align:center;background:var(--input-bg);border:2px solid transparent;
  border-radius:16px;padding:11px 4px;font-size:.76em;font-weight:700;color:var(--ink-soft);cursor:pointer}
.lk.on{background:var(--accent-pale);border-color:var(--accent);color:var(--accent-dk)}

#err{display:none;background:var(--input-bg);border:2px solid var(--danger);color:var(--danger-dk);
  border-radius:20px;padding:14px 16px;font-size:.78em;margin-bottom:16px}
#err a{color:var(--danger-dk);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(18px);background:var(--ink);color:var(--bg);
  font-size:.78em;font-weight:700;padding:12px 26px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:150;white-space:nowrap;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--card);
  display:flex;padding:10px 8px 16px;
  max-width:640px;margin:0 auto;border-radius:28px 28px 0 0;
  box-shadow:0 -14px 32px -16px var(--card-under)}
nav.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:.62em;font-weight:700;color:var(--ink-faint);padding:6px 4px;min-width:0;background:none;border-radius:16px;transition:all .18s}
nav.bottom button .ic{font-size:20px;line-height:1.2}
nav.bottom button.on{color:var(--accent-dk);background:var(--accent-pale)}
.nav-brand{display:none}
.hide{display:none!important}
@media (min-width:900px){
  html{background:var(--bg)}
  body{padding:0 40px 42px 236px;background-attachment:fixed}
  body:has(nav.bottom.hide){padding-left:40px}
  .wrap{max-width:1180px}
  body:has(nav.bottom.hide) .wrap{max-width:760px}
  header{display:flex;align-items:center;gap:18px;text-align:left;padding:36px 0 28px}
  header .sign{width:100%}
  header .brandmark{margin:0;flex:0 0 auto}
  header .sign>div:last-child{min-width:0}
  header h1{font-size:1.55em;letter-spacing:.06em}
  header .sub{font-size:.8em;margin-top:4px}
  .card{padding:28px 26px;margin-bottom:24px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}
  nav.bottom{position:fixed;left:0;top:0;right:auto;bottom:0;width:212px;max-width:none;margin:0;
    display:flex;flex-direction:column;justify-content:flex-start;gap:8px;padding:26px 16px 20px;
    border-radius:0;box-shadow:14px 0 32px -20px var(--card-under)}

];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(NS + k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(NS + k, v); }catch(e){} }
};

function err(msg, html){
  const e = $('err');
  if(html) e.innerHTML = msg; else e.textContent = msg;
  e.style.display = 'block';
  window.scrollTo({ top:0, behavior:'smooth' });
}
function clearErr(){ $('err').style.display = 'none'; }
function toast(msg){
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function friendly(e){
  const c = (e && e.code) || '';
  if(c.includes('permission-denied')) return '權限被擋下來了。請確認 Firebase 規則已發布，而且集合寫的是 {doc=**}。';
  if(c.includes('unauthorized-domain')) return '這個網域還沒授權。Firebase → Authentication → 設定 → 已授權網域，加入 tofudouce.github.io。';
  if(c.includes('popup-blocked')) return '彈出視窗被擋住了。網址列左邊「ᴀA」→ 網站設定 → 允許彈出式視窗。';
  if(c.includes('popup-closed')) return '登入視窗被關掉了，再按一次就好。';
  if(c.includes('unavailable')) return '連不上資料庫，請檢查網路後再試。';
  return '出錯了：' + ((e && e.message) || e);
}

/* ---------- 外觀 ---------- */
function applyTheme(id){
  if(id) document.body.setAttribute('data-theme', id);
  else document.body.removeAttribute('data-theme');
  store.set('theme', id);
  $('themes').querySelectorAll('.th').forEach(t => t.classList.toggle('on', t.dataset.id === id));
  requestAnimationFrame(() => {
    const bg = getComputedStyle(document.body).backgroundColor;
    const mt = document.querySelector('meta[name="theme-color"]');
    if(mt && bg) mt.setAttribute('content', bg);
  });
}
function applyFont(id){
  const f = FONTS.find(x => x.id === id) || FONTS[0];
  document.documentElement.style.setProperty('--font', f.stack);
  store.set('font', f.id);
  $('fontSel').value = f.id;
}
function applyFs(px){
  const v = Math.max(FS_MIN, Math.min(FS_MAX, px));
  document.documentElement.style.setProperty('--fs', v + 'px');
  store.set('fs', v);
  $('fsVal').textContent = v + 'px';
  return v;
}
function applyLook(id){
  if(id) document.body.setAttribute('data-look', id);
  else document.body.removeAttribute('data-look');
  store.set('look', id);
  $('looks').querySelectorAll('.lk').forEach(t => t.classList.toggle('on', t.dataset.id === id));
}

$('themes').innerHTML = THEMES.map(t =>
  '<div class="th" data-id="' + t.id + '"><div class="sw">' +
  t.sw.map(c => '<span style="background:' + c + '"></span>').join('') +
  '</div><small>' + t.label + '</small></div>').join('');
$('themes').addEventListener('click', e => {
  const t = e.target.closest('.th'); if(t) applyTheme(t.dataset.id);
});
$('fontSel').innerHTML = FONTS.map(f => '<option value="' + f.id + '">' + f.label + '</option>').join('');
$('fontSel').addEventListener('change', e => applyFont(e.target.value));
$('looks').innerHTML = LOOKS.map(l => '<div class="lk" data-id="' + l.id + '">' + l.label + '</div>').join('');
$('looks').addEventListener('click', e => {
  const t = e.target.closest('.lk'); if(t) applyLook(t.dataset.id);
});

let fs = FS_DEF;
$('fsUp').addEventListener('click', () => { fs = applyFs(fs + 1); });
$('fsDown').addEventListener('click', () => { fs = applyFs(fs - 1); });
$('btnResetLook').addEventListener('click', () => {
  applyTheme(''); applyFont('maru'); applyLook(''); fs = applyFs(FS_DEF);

});

applyTheme(store.get('theme', ''));
applyFont(store.get('font', 'maru'));
applyLook(store.get('look', ''));
fs = applyFs(parseInt(store.get('fs', FS_DEF), 10) || FS_DEF);

/* ---------- 分頁 ---------- */
const rank = w => (w.order != null ? w.order : (w.updated || 0));
function fmtDT(ms){
  if(!ms) return '';
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '/' + p(d.getMonth()+1) + '/' + p(d.getDate()) + '　' + p(d.getHours()) + ':' + p(d.getMinutes());
}
let cur = null, code = '', works = [], filter = '全部', rows = [];
const TABS = [['shelf','tabShelf'],['edit','tabEdit'],['look','tabLook'],['acc','tabAcc']];

  TABS.forEach(([t, id]) => $(id).classList.toggle('hide', t !== tab));

}

  const b = e.target.closest('button'); if(!b) return;

function paintCats(container){
  container.querySelectorAll('.cat').forEach(el => {
    const on = el.classList.contains('on'), label = el.dataset.c;
    if(!on || label === '全部'){ el.style.background=''; el.style.color=''; el.style.borderColor=''; return; }
    el.style.background = catColor(label); el.style.color = '#fff'; el.style.borderColor = 'transparent';
  });
}
function renderCatPick(list, activeLabel){
  $('catPick').innerHTML = list.map(c =>
    '<div class="cat" data-c="' + esc(c.label) + '">' + esc(c.label) + '</div>').join('');

}
$('catPick').addEventListener('click', e => {
  const t = e.target.closest('.cat'); if(!t) return;
  setCat(t.dataset.c);

  $('catPick').querySelectorAll('.cat').forEach(x => x.classList.toggle('on', x.dataset.c === c));

function renderFilters(){
  $('filters').innerHTML = ['全部'].concat(CATS.map(c => c.label)).map((label, i) =>

}
renderFilters();
$('filters').addEventListener('click', e => {
  const t = e.target.closest('.cat'); if(!t) return;
  filter = t.dataset.c;
  $('filters').querySelectorAll('.cat').forEach(x => x.classList.toggle('on', x === t));
  paintCats($('filters'));
  paintList();
});

/* ---------- 分類管理 ---------- */
let newCatColor = PALETTE[0];
async function loadCategories(){
  try{
    const snap = await getDoc(doc(db, 'meta', 'categories'));
    if(snap.exists() && Array.isArray(snap.data().list) && snap.data().list.length){
      CATS = snap.data().list;
    }else{
      CATS = DEFAULT_CATS.slice();
      await saveCategories();
    }
  }catch(e){ CATS = DEFAULT_CATS.slice(); }
  renderFilters();
  paintCatManage();
}
async function saveCategories(){
  try{ await setDoc(doc(db, 'meta', 'categories'), { list: CATS }); }
  catch(e){ err(friendly(e)); }
}
function paintSwatches(){
  $('newCatSwatch').innerHTML = PALETTE.map(c =>
    '<div class="swatch' + (c === newCatColor ? ' on' : '') + '" data-c="' + c + '" style="background:' + c + '"></div>').join('');

  $('catManage').innerHTML = CATS.map(c =>

  toast('分類刪除了');
});

  await saveCategories();
  $('newCatName').value = '';
  newCatColor = PALETTE[CATS.length % PALETTE.length];
  paintSwatches();
  paintCatManage();

onAuthStateChanged(auth, async user => {
  if(!user){
    $('who').textContent = '尚未登入';
    $('gate').classList.remove('hide');
    $('nav').classList.add('hide');
    TABS.forEach(([, id]) => $(id).classList.add('hide'));
    return;
  }
  if(user.uid !== OWNER){
    $('who').textContent = '這個帳號不是老闆';
    err('登入的帳號不是老闆本人。請登出換一個帳號。');
    $('gate').classList.add('hide');
    $('nav').classList.remove('hide');
    $('accName').textContent = user.displayName || '—';
    $('accUid').textContent = '這個帳號沒有權限';
    go('acc');
    return;
  }
  $('who').textContent = user.displayName + '，歡迎回來';
  $('accName').textContent = user.displayName || '—';
  $('accUid').textContent = '身分編號末四碼　' + user.uid.slice(-4);
  $('gate').classList.add('hide');
  $('nav').classList.remove('hide');
  go('shelf');
  await loadCategories();
  await loadList();
});

/* ---------- 清單 ---------- */
async function loadList(){
  clearErr();
  $('list').innerHTML = '<div class="empty">正在把作品端上來⋯⋯</div>';
  works = [];
  try{
    for(const coll of ['posts_public','posts_private']){
      const snap = await getDocs(collection(db, coll));
      snap.forEach(d => works.push(Object.assign({ id:d.id, coll }, d.data())));
    }
  }catch(e){ err(friendly(e)); $('list').innerHTML = ''; return; }
  works.sort((a, b) => (b.pinned?1:0) - (a.pinned?1:0) || rank(b) - rank(a));
  paintList();
  paintStat();
}
function paintStat(){
  const open = works.filter(w => w.coll === 'posts_public').length;
  $('stOpen').textContent = open;
  $('stLock').textContent = works.length - open;
  $('stKb').textContent = Math.round(works.reduce((s, w) => s + (w.size || 0), 0) / 1024);
}
function paintList(){
  rows = works.filter(w => filter === '全部' || w.cat === filter);
  $('countLine').textContent = '架上的作品　' + works.length + ' 件';
  if(!rows.length){
    $('list').innerHTML = works.length
      ? '<div class="empty">這個分類還是空的。</div>'
      : '<div class="empty">架上還空著。<br>從下面的「新增」收第一件作品進來。</div>';
    return;
  }
  $('list').innerHTML = rows.map(w =>
    '<div class="work" data-id="' + w.coll + '/' + w.id + '">' +
      '<div class="stripe" style="background:' + catColor(w.cat) + '"></div>' +
      '<div class="nm">' + (w.pinned ? '<span class="star">★</span> ' : '') + esc(w.name) + '</div>' +
      (w.desc ? '<div class="ds">' + esc(w.desc) + '</div>' : '') +
      '<div class="mt">' +
        '<span class="chip ' + (w.coll === 'posts_private' ? 'lock">加鎖' : 'open">公開') + '</span>' +
        esc(w.cat || '其他') + '　' + Math.round((w.size||0)/1024) + ' KB　' + fmtDT(w.created || w.updated) +
      '</div>' +
      '<div class="ord">' +
        '<button data-move="up" data-id="' + w.coll + '/' + w.id + '">&#9650;</button>' +
        '<button data-move="down" data-id="' + w.coll + '/' + w.id + '">&#9660;</button>' +
      '</div>' +
    '</div>'
  ).join('');
  $('list').querySelectorAll('.ord button').forEach(b => {
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      move(b.dataset.id, b.dataset.move === 'up' ? -1 : 1);
    });
  });
  $('list').querySelectorAll('.work').forEach(el => {
    el.addEventListener('click', () => {
      const [coll, id] = el.dataset.id.split('/');
      openEdit(works.find(w => w.coll === coll && w.id === id));
    });
  });
}

async function move(key, dir){
  const i = rows.findIndex(w => (w.coll + '/' + w.id) === key);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= rows.length) return;
  const a = rows[i], b = rows[j];
  if(!!a.pinned !== !!b.pinned){ toast('釘選的作品永遠在最前面'); return; }
  const ra = rank(a), rb = rank(b);
  try{
    await updateDoc(doc(db, a.coll, a.id), { order: rb });
    await updateDoc(doc(db, b.coll, b.id), { order: ra });
    a.order = rb; b.order = ra;
    works.sort((x, y) => (y.pinned?1:0) - (x.pinned?1:0) || rank(y) - rank(x));
    paintList();
  }catch(e){ err(friendly(e)); }
}

let bkBlob = null, bkName = '';

function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((res, rej) => {
    const t = document.createElement('script');
    t.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    t.onload = () => window.JSZip ? res(window.JSZip) : rej(new Error('JSZip 沒載到'));
    t.onerror = () => rej(new Error('連不到 JSZip'));
    document.head.appendChild(t);
  });
}
function bkProgress(pct, msg){
  $('bkGauge').classList.remove('hide');
  $('bkGauge').querySelector('span').style.width = Math.max(2, Math.min(100, pct)) + '%';
  $('bkMsg').textContent = msg;
}
function safeName(n, used){
  let base = String(n || 'work').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '-').trim().slice(0, 60) || 'work';
  let name = base + '.html', k = 2;
  while(used.has(name)){ name = base + '-' + k + '.html'; k++; }
  used.add(name);
  return name;
}

async function backup(){
  const btn = $('btnBackup');
  clearErr();
  bkBlob = null;
  $('bkResult').classList.add('hide');
  $('bkShareRow').classList.add('hide');
  if(!works.length){ $('bkMsg').textContent = '架上還沒有作品。'; return; }

  btn.disabled = true;
  btn.textContent = '打包中⋯⋯';
  const stamp = new Date().toISOString().slice(0, 10);
  const failed = [];

  try{
    let zip = null;
    try{ zip = new (await loadJSZip())(); }
    catch(e){ $('bkMsg').textContent = '壓縮工具載不到，改用單一檔案格式。'; }

    const used = new Set();
    const manifest = [];

    for(let i = 0; i < works.length; i++){
      const w = works[i];
      bkProgress((i / works.length) * 70, '讀取中 ' + (i + 1) + ' / ' + works.length + '　' + (w.name || ''));
      let code = '';
      try{
        const snap = await getDoc(doc(db, w.coll, w.id, 'blob', 'source'));
        code = snap.exists() ? (snap.data().code || '') : '';
      }catch(e){ failed.push(w.name || w.id); continue; }
      if(!code){ failed.push(w.name || w.id); continue; }

      const folder = w.coll === 'posts_private' ? '加鎖' : '公開';
      const file = safeName(w.name, used);
      manifest.push({ id:w.id, coll:w.coll, name:w.name, desc:w.desc, cat:w.cat,
        pinned:!!w.pinned, order:rank(w), size:w.size, file:folder + '/' + file });
      if(zip) zip.folder(folder).file(file, code);
      else manifest[manifest.length - 1].code = code;
    }

    if(!manifest.length) throw new Error('一件都讀不到');

    if(zip){
      zip.file('作品清單.json', JSON.stringify({ site:'小怪獸咖啡館', at:new Date().toISOString(), works:manifest }, null, 1));
      bkBlob = await zip.generateAsync(
        { type:'blob', compression:'DEFLATE', compressionOptions:{ level:6 } },
        m => bkProgress(70 + m.percent * 0.3, '壓縮中 ' + Math.round(m.percent) + '%')
      );
      bkName = 'cafe-backup-' + stamp + '.zip';
    }else{
      bkBlob = new Blob([JSON.stringify({ site:'小怪獸咖啡館', at:new Date().toISOString(), works:manifest }, null, 1)],
        { type:'application/json' });
      bkName = 'cafe-backup-' + stamp + '.json';
    }

    const mb = (bkBlob.size / 1048576).toFixed(2);
    $('bkLink').href = URL.createObjectURL(bkBlob);
    $('bkLink').download = bkName;
    $('bkLink').textContent = '下載 ' + bkName + '（' + mb + ' MB）';
    $('bkResult').classList.remove('hide');

    try{
      const f = new File([bkBlob], bkName, { type: bkBlob.type });
      if(navigator.canShare && navigator.canShare({ files:[f] })) $('bkShareRow').classList.remove('hide');
    }catch(e){}

    bkProgress(100, failed.length
      ? '打包好了，但有 ' + failed.length + ' 件讀不到：' + failed.join('、')
      : '打包好了，' + manifest.length + ' 件。點下面的按鈕存起來。');
  }catch(e){
    $('bkGauge').classList.add('hide');
    $('bkMsg').textContent = '';
    err('備份失敗：' + ((e && e.message) || e));
  }finally{
    btn.disabled = false;
    btn.textContent = '備份全部作品';
  }
}
$('btnBackup').addEventListener('click', backup);
$('bkShare').addEventListener('click', async () => {
  if(!bkBlob) return;
  try{
    await navigator.share({ files:[new File([bkBlob], bkName, { type: bkBlob.type })], title: bkName });
  }catch(e){
    if(e && e.name !== 'AbortError') toast('存檔沒成功，改用上面那顆下載');
  }
});

/* ---------- 縮圖 ---------- */
function loadH2C(){
  if(window.html2canvas) return Promise.resolve(window.html2canvas);
  return new Promise((res, rej) => {
    const t = document.createElement('script');
    t.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    t.onload = () => window.html2canvas ? res(window.html2canvas) : rej(new Error('no h2c'));
    t.onerror = () => rej(new Error('connect fail'));
    document.head.appendChild(t);
  });
}
function makeThumb(code){
  return new Promise((resolve, reject) => {
    const fr = $('shotFrame');
    let done = false;
    const timer = setTimeout(() => { if(!done){ done = true; reject(new Error('timeout')); } }, 8000);
    fr.onload = async () => {
      if(done) return;
      try{
        await new Promise(r => setTimeout(r, 900));
        const doc2 = fr.contentDocument;
        const h2c = await loadH2C();
        const canvas = await h2c(doc2.body, {
          width:1200, height:900, windowWidth:1200, windowHeight:900,
          scale:0.34, backgroundColor:'#ffffff', logging:false, useCORS:true
        });
        const small = document.createElement('canvas');
        small.width = 408; small.height = 306;
        small.getContext('2d').drawImage(canvas, 0, 0, 408, 306);
        const url = small.toDataURL('image/jpeg', 0.7);
        done = true; clearTimeout(timer);
        resolve(url.length > 700000 ? '' : url);
      }catch(e){ done = true; clearTimeout(timer); reject(e); }
    };
    fr.srcdoc = code;
  });
}

/* ---------- 編輯 ---------- */
function setMeter(){
  const g = $('gauge'), m = $('meter');
  if(!code){
    g.querySelector('span').style.width = '0';
    g.classList.remove('bad'); m.classList.remove('bad');
    m.textContent = '還沒有程式碼';
    return;
  }
  const b = new Blob([code]).size;
  g.querySelector('span').style.width = Math.min(100, b / MAX * 100) + '%';
  g.classList.toggle('bad', b > MAX);
  m.classList.toggle('bad', b > MAX);
  m.textContent = b > MAX
    ? Math.round(b/1024) + ' KB，超過 880 KB 上限，存不進去'
    : Math.round(b/1024) + ' KB　／　上限 880 KB';
}
function setLock(v){
  $('tgPub').classList.toggle('on', !v);
  $('tgLock').classList.toggle('on', v);
}
$('tgPub').addEventListener('click', () => setLock(false));
$('tgLock').addEventListener('click', () => setLock(true));
$('tgPin').addEventListener('click', e => e.currentTarget.classList.toggle('on'));

function newWork(){
  cur = null; code = '';
  $('edTitle').textContent = '收一件新作品';
  $('fName').value = ''; $('fDesc').value = '';
  $('fFile').value = ''; $('fileLabel').textContent = '從「檔案」選一個 HTML 檔';
  renderCatPick(CATS, (CATS[0] && CATS[0].label) || '其他');
  setLock(false);
  $('tgPin').classList.remove('on');
  setMeter();
  $('btnDel').classList.add('hide');
  go('edit');
}
async function openEdit(w){
  if(!w) return;
  clearErr();
  cur = w; code = '';
  $('edTitle').textContent = '編輯作品';
  $('fName').value = w.name || '';
  $('fDesc').value = w.desc || '';
  $('fFile').value = ''; $('fileLabel').textContent = '換一個 HTML 檔';
  const extra = (w.cat && !CATS.some(c => c.label === w.cat)) ? [{ label:w.cat, color:catColor(w.cat) }] : [];
  renderCatPick(CATS.concat(extra), w.cat || (CATS[0] && CATS[0].label) || '其他');
  setLock(w.coll === 'posts_private');
  $('tgPin').classList.toggle('on', !!w.pinned);
  $('meter').textContent = '讀取程式碼中⋯⋯';
  $('btnDel').classList.remove('hide');
  go('edit');
  try{
    const snap = await getDoc(doc(db, w.coll, w.id, 'blob', 'source'));
    code = snap.exists() ? (snap.data().code || '') : '';
  }catch(e){ err(friendly(e)); }
  setMeter();
}

$('fFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    code = r.result;
    $('fileLabel').textContent = f.name;
    if(!$('fName').value) $('fName').value = f.name.replace(/\.html?$/i, '');
    setMeter();
  };
  r.onerror = () => err('這個檔案讀不起來，換一個試試。');
  r.readAsText(f, 'utf-8');
});

$('btnSave').addEventListener('click', async () => {
  clearErr();
  const name = $('fName').value.trim();
  if(!name){ err('先給它一個名稱。'); return; }
  if(!code){ err('還沒選程式碼檔案。'); return; }
  const size = new Blob([code]).size;
  if(size > MAX){ err('這份檔案 ' + Math.round(size/1024) + ' KB，超過 880 KB 上限，存不進去。'); return; }

  const isLock = $('tgLock').classList.contains('on');
  const coll = isLock ? 'posts_private' : 'posts_public';
  const id = cur ? cur.id : (Date.now().toString(36) + Math.random().toString(36).slice(2, 7));
  const btn = $('btnSave');
  btn.disabled = true; btn.textContent = '儲存中⋯⋯';
  try{
    let thumb = '';
    btn.textContent = '產生縮圖⋯⋯';
    try{ thumb = await makeThumb(code); }catch(e){ thumb = ''; }

    await setDoc(doc(db, coll, id), {
      name, desc: $('fDesc').value.trim(), cat: pickedCat(),
      pinned: $('tgPin').classList.contains('on'),
      order: (cur && cur.order != null) ? cur.order : Date.now(),
      created: (cur && cur.created) ? cur.created : Date.now(),
      size, thumb, updated: Date.now()
    });
    await setDoc(doc(db, coll, id, 'blob', 'source'), { code });
    if(cur && cur.coll !== coll){
      await deleteDoc(doc(db, cur.coll, cur.id, 'blob', 'source'));
      await deleteDoc(doc(db, cur.coll, cur.id));
    }
    backToShelf();
    toast('已收進架上');
  }catch(e){ err(friendly(e)); }
  finally{ btn.disabled = false; btn.textContent = '儲存'; }
});

$('btnDel').addEventListener('click', async () => {
  if(!cur) return;
  if(!confirm('「' + cur.name + '」會被永久刪掉，包含程式碼。確定嗎？')) return;
  clearErr();
  try{
    await deleteDoc(doc(db, cur.coll, cur.id, 'blob', 'source'));
    await deleteDoc(doc(db, cur.coll, cur.id));
    backToShelf();
    toast('已經刪掉了');
  }catch(e){ err(friendly(e)); }
});

$('btnPrev').addEventListener('click', () => {
  clearErr();
  if(!code){ err('還沒有程式碼可以預覽。'); return; }
  const url = URL.createObjectURL(new Blob([code], { type:'text/html' }));
  const w = window.open(url, '_blank');
  if(!w){
    err('Safari 擋住了新視窗。<a href="' + url + '" target="_blank" rel="noopener">點這裡手動開啟</a>，或到網址列左邊「ᴀA」→ 網站設定 → 允許彈出式視窗。', true);
    return;
  }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
});

$('btnDown').addEventListener('click', () => {
  clearErr();
  if(!code){ err('還沒有程式碼可以下載。'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([code], { type:'text/html' }));
  a.download = ($('fName').value.trim() || 'work') + '.html';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});

$('btnBack').addEventListener('click', backToShelf);
$('btnReload').addEventListener('click', async () => { await loadList(); toast('架上已更新'); });

function backToShelf(){
  cur = null; code = '';
  go('shelf');
  loadList();
}

  if(sky && !sky.children.length){
