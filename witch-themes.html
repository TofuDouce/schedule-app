<script>
(function(){
var raw=document.getElementById("d").textContent.trim().split(".");
function u(s){var b=atob(s),a=new Uint8Array(b.length),i;
for(i=0;i<b.length;i++){a[i]=b.charCodeAt(i);}return a;}
var e=document.getElementById("e"),p=document.getElementById("p"),b=document.getElementById("b");
function go(){
if(!window.crypto||!crypto.subtle){e.textContent="請用 https 的網址開啟這一頁";return;}
e.textContent="解密中…";b.disabled=true;
var salt=u(raw[0]),iv=u(raw[1]),ct=u(raw[2]);
crypto.subtle.importKey("raw",new TextEncoder().encode(p.value),"PBKDF2",false,["deriveKey"])
.then(function(base){return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:250000,hash:"SHA-256"},
base,{name:"AES-GCM",length:256},false,["decrypt"]);})
.then(function(key){return crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);})
.then(function(out){var html=new TextDecoder().decode(out);
document.open();document.write(html);document.close();})
.catch(function(){e.textContent="密碼不對，再試一次";p.value="";b.disabled=false;p.focus();});
}
b.addEventListener("click",go);
p.addEventListener("keydown",function(ev){if(ev.key==="Enter"){go();}});
p.focus();
})();
</script>
