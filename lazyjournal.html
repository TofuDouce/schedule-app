<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3ead8">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>古典慵懶手札 · 把日子慢慢理順</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f4d38'/%3E%3Cpath d='M32 12l6 14 14 6-14 6-6 14-6-14-14-6 14-6z' fill='%23e5c585'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&family=Iansui&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
:root{--bg-abyss:#f3ead8;--bg-card:#faf5ea;--bg-card-elevated:#fffcf5;--bg-velvet:#ebe0ca;--vivid:#292524;--deep:#0f0d0c;--gold:#8c6222;--text:#231f1c;--muted:#574f47;--on:#faf5ea;--crimson:#992244}
*{box-sizing:border-box}html{font-size:16px}
body{margin:0;background:var(--bg-abyss);color:var(--text);font-family:"Huninn","PingFang TC","Noto Sans TC",sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
.login{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px 16px;overflow-y:auto;background-image:radial-gradient(circle at 50% 0,rgba(140,98,34,.18),transparent 38rem)}
.login.hidden{display:none!important}
.login-card{width:100%;max-width:400px;margin:auto;text-align:center;padding:34px 22px 26px;background:linear-gradient(180deg,var(--bg-card-elevated),var(--bg-abyss));border:1.5px solid var(--vivid);outline:1px dashed var(--gold);outline-offset:-6px;border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14)}
.login-mark{display:flex;justify-content:center;margin-bottom:14px}
.sec-icon{width:46px;height:46px;transform:rotate(45deg);border:1px solid var(--gold);background:var(--vivid);color:var(--on);display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin:6px}
.sec-icon i{transform:rotate(-45deg)}
.login h1{margin:0;font-size:1.7rem;letter-spacing:.14em;font-weight:700;color:var(--vivid)}
.login-sub{color:var(--muted);font-size:.9rem;letter-spacing:.2em;margin-top:6px}
.bead-chain-divider{display:flex;align-items:center;justify-content:center;gap:10px;margin:14px auto;color:var(--gold);font-size:.7rem}
.bead-chain-line{flex:1;max-width:120px;height:1px;background:var(--gold);opacity:.5}
.login-msg{font-size:.92rem;color:var(--muted);line-height:1.8;margin:6px 0 16px}
.login-err{color:var(--crimson);font-size:.82rem;margin-top:12px;line-height:1.6}
.login pre{text-align:left;font-size:.68rem;line-height:1.5;background:var(--bg-velvet);border:1px solid rgba(41,37,36,.28);border-radius:8px;padding:10px;overflow-x:auto;white-space:pre;margin:10px 0}
.btn{appearance:none;min-height:42px;padding:0 16px;border-radius:21px;border:1px solid rgba(41,37,36,.28);background:var(--bg-card-elevated);color:var(--deep);font:inherit;font-size:.88rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;letter-spacing:.05em;margin-top:8px}
.btn.primary{background:linear-gradient(180deg,var(--vivid),var(--deep));color:var(--on);border-color:var(--deep)}
.btn.block{width:100%}
</style>
</head>
<body class="locked" data-texture="parchment" data-frame="filigree" data-lace="on">
<div class="login" id="loginView"><div class="frame login-card"><div class="login-mark"><span class="sec-icon big"><i class="fa-solid fa-feather-pointed"></i></span></div><h1>古典慵懶手札</h1><div class="login-sub">把日子慢慢理順</div><div class="bead-chain-divider"><span class="bead-chain-line"></span><i class="fa-solid fa-diamond"></i><span class="bead-chain-line"></span></div><div id="loginBody"><p class="login-msg"><i class="fa-solid fa-rotate fa-spin"></i> 正在確認登入狀態…</p></div></div></div>
<script>
setTimeout(function(){if(!window.__shellOK){var b=document.getElementById('loginBody');if(b)b.innerHTML='<p class="login-msg">連不上 Firebase，請確認網路後重新整理頁面。</p>'}},9000);
</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, getFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, getDoc, getDocs, writeBatch } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
/* 外殼：只負責登入。手札本體在登入並確認是本人後，才從資料庫下載 */
const firebaseConfig={apiKey:"AIzaSyC4oq_W36ji4o6p7p2JxLS2FKc-gITFJ4I",authDomain:"monster-cafe-79d56.firebaseapp.com",projectId:"monster-cafe-79d56",storageBucket:"monster-cafe-79d56.firebasestorage.app",messagingSenderId:"327222778800",appId:"1:327222778800:web:a38e81d92c8def3621d475"};
const OWNER_UID='CbBcZ01ymNQou4X6HMfNMtEgXRl2';
const ROOT='planner_v2',CHUNK=120000;
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
let db;try{db=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(fbApp)}
window.__shellOK=true;
const RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function isOwner() {
      return request.auth != null
        && request.auth.uid == '${OWNER_UID}';
    }

    match /posts_public/{doc=**} {
      allow read: if true;
      allow write: if isOwner();
    }

    match /posts_private/{doc=**} {
      allow read, write: if isOwner();
    }

    match /meta/{doc=**} {
      allow read: if true;
      allow write: if isOwner();
    }

    match /planner_v2/{doc=**} {
      allow read, write: if isOwner();
    }
  }
}`;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let loaded=false,CUR=null;

function loginHTML(mode,info){
 const G=`<button class="btn primary block" data-act="gsignin"><i class="fa-brands fa-google"></i> 使用 Google 帳號登入</button>`;
 const OUT=`<button class="btn block" data-act="gsignout"><i class="fa-solid fa-right-from-bracket"></i> 登出，換一個帳號</button>`;
 switch(mode){
  case'check':return`<p class="login-msg"><i class="fa-solid fa-rotate fa-spin"></i> 正在確認登入狀態…</p>`;
  case'loadingApp':return`<p class="login-msg"><i class="fa-solid fa-rotate fa-spin"></i> 正在從雲端取回你的手札…</p>`;
  case'loading':return`<p class="login-msg"><i class="fa-solid fa-rotate fa-spin"></i> 正在打開你的手札…</p>`;
  case'signin':return`<p class="login-msg">這是私人的手札。<br>請用你的 Google 帳號登入，才能打開內容。</p>${G}<div class="login-err" id="loginErr"></div>`;
  case'denied':return`<p class="login-msg">這個帳號（${esc(info&&(info.email||info.displayName)||'')}）沒有進入手札的權限。</p>${OUT}`;
  case'rules':return`<p class="login-msg">已登入，但資料庫還不允許手札讀寫。<br>請到 Firebase 主控台 → Firestore Database → 規則，把裡面的內容整份刪掉，貼上下面這一整份，再按「發布」。</p><pre>${esc(RULES)}</pre><button class="btn block" data-act="copyRules"><i class="fa-solid fa-copy"></i> 複製規則</button><button class="btn primary block" data-act="retryBoot"><i class="fa-solid fa-rotate"></i> 發布後點這裡重試</button>${OUT}`;
  case'noapp':return`<p class="login-msg">已登入。雲端還沒有手札本體。<br>請選擇 <b>app-payload.json</b> 上傳一次（只要做這一次）。</p>${UP()}${OUT}`;
  case'upload':return`<p class="login-msg">更新手札本體：請選擇新的 <b>app-payload.json</b>。</p>${UP()}<button class="btn block" data-act="startApp">不更新，直接打開手札</button>${OUT}`;
  case'uploading':return`<p class="login-msg"><i class="fa-solid fa-rotate fa-spin"></i> 上傳中，請稍候…</p>`;
  case'legacy':return`<p class="login-msg">偵測到這支手機上有舊版「秩序手札」的資料。<br>要把它搬進雲端資料庫嗎？</p><button class="btn primary block" data-act="lgImport"><i class="fa-solid fa-cloud-arrow-up"></i> 搬進來</button><button class="btn block" data-act="lgSkip">不用，從頭開始</button>`;
  case'error':default:return`<p class="login-msg">打開手札時遇到問題：<br>${esc(info&&info.message||info||'')}</p><button class="btn primary block" data-act="retryBoot"><i class="fa-solid fa-rotate"></i> 重試</button>${OUT}`}}
function UP(){return`<label class="btn primary block" for="payloadFile"><i class="fa-solid fa-cloud-arrow-up"></i> 選擇檔案並上傳</label><input type="file" id="payloadFile" accept=".json,application/json" style="display:none"><div class="login-err" id="loginErr"></div>`}
function showLogin(mode,info){document.body.classList.add('locked');$('#loginView').classList.remove('hidden');$('#loginBody').innerHTML=loginHTML(mode,info)}
function loginErr(m){const e=$('#loginErr');if(e)e.textContent=m}
function friendlyErr(e){const c=(e&&e.code)||'';
 if(c.includes('popup-blocked'))return'彈出視窗被瀏覽器封鎖，請允許彈出視窗後再試。';
 if(c.includes('popup-closed')||c.includes('cancelled'))return'登入視窗已關閉，請再點一次登入按鈕。';
 if(c.includes('unauthorized-domain'))return'這個網址還沒加入 Firebase 的授權網域：請到 Authentication → 設定 → 授權網域，加入這個網站的網域。';
 if(c.includes('network'))return'網路不穩，請確認連線後再試。';
 return'登入失敗：'+((e&&e.message)||e)}

/* ── 本體下載／上傳（存放位置：planner_v2/_app 與 planner_v2/_app/chunks/*）── */
async function fetchPayload(){
 const m=await getDoc(doc(db,ROOT,'_app'));
 if(!m.exists())return null;
 const n=m.data().n|0;
 const qs=await getDocs(collection(db,ROOT,'_app','chunks'));
 const arr=[];qs.forEach(d=>arr.push(d.data()));
 arr.sort((a,b)=>a.i-b.i);
 if(arr.length<n||!n)throw new Error('手札本體不完整（'+arr.length+'/'+n+'），請重新上傳 app-payload.json');
 const p=JSON.parse(arr.slice(0,n).map(x=>x.t).join(''));
 if(!p||typeof p.js!=='string'||typeof p.body!=='string')throw new Error('手札本體格式不正確');
 return p}
function splitText(t){const out=[];let i=0;while(i<t.length){let j=Math.min(i+CHUNK,t.length);if(j<t.length){const c=t.charCodeAt(j-1);if(c>=0xD800&&c<=0xDBFF)j--}out.push(t.slice(i,j));i=j}return out}
async function uploadPayload(text){
 const p=JSON.parse(text);
 if(!p||typeof p.js!=='string'||typeof p.body!=='string'||typeof p.css!=='string')throw new Error('這不是正確的 app-payload.json');
 const parts=splitText(text);
 const old=await getDocs(collection(db,ROOT,'_app','chunks'));
 const b=writeBatch(db);
 old.forEach(d=>b.delete(d.ref));
 parts.forEach((t,i)=>b.set(doc(db,ROOT,'_app','chunks',String(i).padStart(3,'0')),{i,t}));
 b.set(doc(db,ROOT,'_app'),{n:parts.length,v:p.v||1,updatedAt:Date.now()});
 await b.commit();
 return p}
function inject(p){
 const st=document.createElement('style');st.id='appCss';st.textContent=p.css;document.head.appendChild(st);
 document.body.insertAdjacentHTML('beforeend',p.body);
 const sc=document.createElement('script');sc.textContent=p.js;document.body.appendChild(sc)}
async function runApp(p){
 if(!loaded){loaded=true;inject(p)}
 if(typeof window.__LAZY_START!=='function'){loaded=false;throw new Error('手札本體沒有正確啟動，請重新上傳')}
 window.__LAZY_START(CUR)}

async function enter(user){
 CUR=user;
 if(new URLSearchParams(location.search).has('upload')){showLogin('upload');return}
 if(loaded){window.__LAZY_START(user);return}
 showLogin('loadingApp');
 let p;
 try{p=await fetchPayload()}catch(e){
  if(((e&&e.code)||'').includes('permission-denied'))showLogin('rules');else showLogin('error',e);return}
 if(!p){showLogin('noapp');return}
 try{await runApp(p)}catch(e){showLogin('error',e)}}

window.__FB={auth,db,doc,collection,getDoc,getDocs,writeBatch,signOut,OWNER_UID,RULES,showLogin};

const act={
 gsignin:async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){loginErr(friendlyErr(e))}},
 gsignout:()=>{signOut(auth)},
 copyRules:()=>{try{navigator.clipboard.writeText(RULES)}catch(e){}},
 retryBoot:()=>{if(CUR)enter(CUR);else showLogin('signin')},
 startApp:()=>{history.replaceState(null,'',location.pathname);enter(CUR)}
};
document.addEventListener('click',e=>{
 const el=e.target.closest('#loginView [data-act]');if(!el)return;
 const k=el.dataset.act;
 if(loaded&&k!=='gsignin'&&k!=='gsignout'&&k!=='copyRules'&&k!=='retryBoot'&&k!=='startApp')return;
 if(loaded&&(k==='copyRules'||k==='retryBoot'))return; /* 載入後由手札本體處理 */
 if(act[k]){e.preventDefault();act[k]()}});
document.addEventListener('change',async e=>{
 if(!e.target||e.target.id!=='payloadFile')return;
 const f=e.target.files&&e.target.files[0];if(!f)return;
 try{const text=await f.text();JSON.parse(text);showLogin('uploading');
  const p=await uploadPayload(text);history.replaceState(null,'',location.pathname);
  await runApp(p)}
 catch(err){showLogin(loaded?'upload':'noapp');loginErr('上傳失敗：'+((err&&err.message)||err))}});

showLogin('check');
onAuthStateChanged(auth,user=>{
 if(!user){if(loaded){location.reload();return}CUR=null;showLogin('signin');return}
 if(user.uid!==OWNER_UID){CUR=user;showLogin('denied',user);return}
 enter(user)});

</script>
</body>
</html>
