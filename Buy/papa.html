<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>農會趴趴灶｜團購清單</title>
  <meta name="description" content="貼上趴趴灶商品網址，自動整理規格、數量與總金額，方便跟親朋好友團購。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4efe4;
      --bg-2: #efe6d4;
      --paper: #fffaf1;
      --ink: #1f2a1c;
      --muted: #5d6758;
      --line: #e0d4bc;
      --green: #2f6a3a;
      --green-2: #1e4d29;
      --leaf: #7ea36a;
      --gold: #c9842a;
      --danger: #b42318;
      --ok: #1b7f4a;
      --shadow: 0 10px 30px rgba(40, 50, 30, .08);
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans TC", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #f7e7b8 0%, transparent 50%),
        radial-gradient(900px 400px at 110% 0%, #d7e8c8 0%, transparent 46%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    a { color: var(--green-2); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 140px; }
    header.hero {
      display: flex; gap: 16px; align-items: flex-end; justify-content: space-between;
      flex-wrap: wrap; margin-bottom: 18px;
    }
    .brand { display: flex; gap: 12px; align-items: center; }
    .logo {
      width: 52px; height: 52px; border-radius: 16px;
      background: linear-gradient(160deg, #3e8a4a, #1f4d28);
      color: #fff; display: grid; place-items: center; font-size: 26px;
      box-shadow: var(--shadow);
    }
    h1 {
      font-family: Fraunces, "Noto Sans TC", serif;
      font-size: 28px; margin: 0; letter-spacing: .02em;
    }
    .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 10px; font-size: 12px; color: var(--muted);
    }
    .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
      margin-bottom: 16px;
    }
    label.lbl { display: block; font-weight: 700; margin-bottom: 8px; }
    textarea {
      width: 100%; min-height: 132px; resize: vertical;
      border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; font: inherit; background: #fff;
      line-height: 1.5;
    }
    textarea:focus, select:focus, input:focus { outline: 2px solid #8fbf7a; border-color: var(--leaf); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    button, .btn {
      appearance: none; border: 0; cursor: pointer;
      border-radius: 999px; padding: 10px 16px; font: inherit; font-weight: 700;
    }
    .btn-primary { background: var(--green); color: #fff; }
    .btn-primary:hover { background: var(--green-2); }
    .btn-ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn-ghost:hover { background: var(--bg-2); }
    .btn-danger { background: #f8e4e1; color: var(--danger); }
    .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
    .status { font-size: 13px; margin-top: 10px; min-height: 1.2em; }
    .status.err { color: var(--danger); }
    .status.ok { color: var(--ok); }
    .grid { display: grid; gap: 12px; }
    .card {
      display: grid; grid-template-columns: 92px 1fr; gap: 12px;
      background: var(--paper); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow);
    }
    .thumb {
      width: 92px; height: 92px; border-radius: 14px; object-fit: cover;
      background: #efe7d6; border: 1px solid var(--line);
    }
    .title { font-weight: 800; line-height: 1.35; margin: 0 0 4px; }
    .meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      background: #edf5e6; color: #26552c; border-radius: 999px; padding: 1px 8px;
    }
    .pill.warn { background: #fbe8c8; color: #7a4a00; }
    .pill.out { background: #f8e4e1; color: var(--danger); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
    select, .qty input, .who input {
      border: 1px solid var(--line); border-radius: 12px; background: #fff;
      padding: 8px 10px; font: inherit;
    }
    select { min-width: 180px; max-width: 100%; }
    .qty { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
    .qty button { border-radius: 0; background: #f6f1e6; width: 36px; height: 36px; padding: 0; font-size: 18px; }
    .qty input { width: 48px; border: 0; text-align: center; padding: 0; height: 36px; border-radius: 0; }
    .who input { width: 120px; }
    .line-price { margin-left: auto; font-weight: 800; font-size: 18px; white-space: nowrap; }
    .card-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 10px; background: #fff;
      border: 1px solid var(--line); display: grid; place-items: center; padding: 0;
    }
    .summary {
      position: sticky; bottom: 0; left: 0; right: 0;
      background: rgba(255,250,241,.92); backdrop-filter: blur(10px);
      border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      z-index: 20;
    }
    .summary-inner { max-width: 1080px; margin: 0 auto; display: grid; gap: 8px; }
    .sum-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
    .total { font-family: Fraunces, serif; font-size: 32px; font-weight: 700; color: var(--green-2); }
    .bars { display: grid; gap: 6px; }
    .bar-row { display: grid; grid-template-columns: 88px 1fr 90px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
    .bar { height: 8px; background: #e8dfcc; border-radius: 99px; overflow: hidden; }
    .bar > span { display: block; height: 100%; background: linear-gradient(90deg, #6aa35a, #2f6a3a); }
    .empty {
      text-align: center; color: var(--muted); padding: 36px 12px;
      border: 1px dashed var(--line); border-radius: var(--radius); background: rgba(255,255,255,.45);
    }
    .split { display: grid; grid-template-columns: 1.3fr .7fr; gap: 16px; }
    @media (max-width: 820px) {
      .split { grid-template-columns: 1fr; }
      .card { grid-template-columns: 72px 1fr; }
      .thumb { width: 72px; height: 72px; }
      h1 { font-size: 22px; }
      .total { font-size: 26px; }
      .line-price { width: 100%; margin: 4px 0 0; }
    }
    .member-list { display: grid; gap: 6px; font-size: 14px; }
    .member-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--line); }
    dialog {
      border: 0; border-radius: 18px; padding: 0; width: min(560px, calc(100vw - 24px));
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    dialog::backdrop { background: rgba(30,40,20,.45); }
    .modal { padding: 18px; }
    pre.copy {
      white-space: pre-wrap; background: #1f2a1c; color: #f4efe4;
      border-radius: 12px; padding: 12px; font-size: 13px; max-height: 46vh; overflow: auto;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="brand">
        <div class="logo">灶</div>
        <div>
          <h1>趴趴灶團購清單</h1>
          <p class="sub">貼上商品網址，自動抓價格、規格與數量，加總給親朋好友看。此頁只做對帳，下單請回官網。</p>
        </div>
      </div>
      <span class="chip">資料來源 papazao.tw</span>
    </header>

    <section class="panel">
      <label class="lbl" for="urls">貼上商品網址（一行一個，可一次很多筆）</label>
      <textarea id="urls" placeholder="https://www.papazao.tw/products/..."></textarea>
      <div class="row">
        <button class="btn-primary" id="btnLoad">讀取並加入清單</button>
        <button class="btn-ghost" id="btnSample">放入範例網址</button>
        <button class="btn-ghost" id="btnClearUrls">清空輸入框</button>
      </div>
      <p class="hint">
        支援完整商品頁連結。有多規格的商品會出現下拉選單，數量可直接改。
        公開網址請用資料夾裡的部署方式（Cloudflare / Netlify），親友才能一起抓到即時價格。
      </p>
      <div class="status" id="status"></div>
    </section>

    <div class="split">
      <section>
        <div style="display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;">
          <strong>購物清單</strong>
          <div class="row" style="margin:0;">
            <button class="btn-ghost" id="btnCopy">複製給群組</button>
            <button class="btn-danger" id="btnReset">清空清單</button>
          </div>
        </div>
        <div class="grid" id="list"></div>
        <div class="empty" id="empty">還沒有商品。把趴趴灶網址貼上去即可開始。</div>
      </section>

      <aside>
        <div class="panel">
          <label class="lbl">免運門檻（官網商品頁標示）</label>
          <div class="hint" style="margin:0 0 10px;">同一溫層可跨農會合併計算；常溫與冷凍不能互抵。</div>
          <div id="shipHint"></div>
        </div>
        <div class="panel">
          <label class="lbl">依備註分帳</label>
          <p class="hint" style="margin-top:0;">在商品的「誰要買」填名字，這裡會自動加總每人小計。</p>
          <div class="member-list" id="members"><div class="hint">尚未填寫名字</div></div>
        </div>
      </aside>
    </div>
  </div>

  <div class="summary">
    <div class="summary-inner">
      <div class="bars" id="bars"></div>
      <div class="sum-top">
        <div>
          <div class="hint" style="margin:0;" id="countLine">0 項商品</div>
          <div class="total" id="grand">NT$0</div>
        </div>
        <div class="row" style="margin:0;">
          <button class="btn-ghost" id="btnCopy2">複製清單</button>
        </div>
      </div>
    </div>
  </div>

  <dialog id="dlg">
    <div class="modal">
      <strong>複製到 LINE / 訊息</strong>
      <p class="hint">已選取文字，可直接複製。</p>
      <pre class="copy" id="copyText"></pre>
      <div class="row">
        <button class="btn-primary" id="btnDoCopy">複製</button>
        <button class="btn-ghost" id="btnClose">關閉</button>
      </div>
    </div>
  </dialog>

  <script>
    const SAMPLE = [
      "https://www.papazao.tw/products/zhongpu-farmers-association-authentic-dried-tomato-natural-fruit-snack",
      "https://www.papazao.tw/products/guanxi-farmers-association-natural-grass-jelly-tea-bags-90pack-bulk",
      "https://www.papazao.tw/products/madou-pomelo-salt-and-pepper-seasoning-refreshing-citrus-flavor-for-fried-chicken",
      "https://www.papazao.tw/products/sigang-farmers-sesame-oil-balm-mint",
    ];

    const SHIP = {
      normal: { label: "常溫", cvs: 1500, home: 3000 },
      refrigerated: { label: "冷藏", cvs: 1500, home: 3000 },
      frozen: { label: "冷凍", cvs: 2500, home: 5000 },
    };

    const KEY = "papazao-groupbuy-v1";
    const $ = (id) => document.getElementById(id);
    let items = [];

    function money(n) {
      return "NT$" + Math.round(n || 0).toLocaleString("zh-TW");
    }

    function parseUrls(text) {
      const re = /https?:\/\/(?:www\.)?papazao\.tw\/products\/([a-zA-Z0-9\-]+)/g;
      const out = [];
      const seen = new Set();
      let m;
      while ((m = re.exec(text))) {
        const handle = m[1];
        if (!seen.has(handle)) {
          seen.add(handle);
          const full = m[0];
          const vid = /[?&]variant=(\d+)/.exec(full);
          out.push({ handle, variantHint: vid ? vid[1] : null });
        }
      }
      return out;
    }

    function imgUrl(product, variant) {
      const fromVariant = variant && variant.photos && variant.photos[0];
      let raw = product.featured_image && (product.featured_image.compact || product.featured_image.medium);
      if (product.photo_urls && product.photo_urls[0]) {
        raw = product.photo_urls[0].compact || product.photo_urls[0].medium || raw;
      }
      if (!raw) return "";
      return raw.startsWith("//") ? "https:" + raw : raw;
    }

    function tempKey(product) {
      const t = (product.temperature_types && product.temperature_types[0]) || "normal";
      if (t.includes("frozen") || t.includes("freeze") || t === "冷凍") return "frozen";
      if (t.includes("refrigerat") || t === "冷藏") return "refrigerated";
      return "normal";
    }

    async function fetchJson(url) {
      const res = await fetch(url, { headers: { Accept: "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    async function loadProduct(handle) {
      const official = `https://www.papazao.tw/products/${handle}.json`;
      const qs = `handle=${encodeURIComponent(handle)}`;
      const tries = [
        `/proxy?${qs}`,
        `/api/product?${qs}`,
        `/.netlify/functions/proxy?${qs}`,
        official,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(official)}`,
        `https://corsproxy.org/?${encodeURIComponent(official)}`,
      ];
      let last = null;
      for (const u of tries) {
        try {
          const data = await fetchJson(u);
          if (data && data.error) throw new Error(data.error);
          if (data && data.title && data.variants) return data;
          if (data && data.contents) {
            const inner = JSON.parse(data.contents);
            if (inner.title) return inner;
          }
        } catch (e) {
          last = e;
        }
      }
      throw last || new Error("讀取失敗");
    }

    function addProduct(product, variantHint) {
      const variants = (product.variants || []).filter(Boolean);
      if (!variants.length) throw new Error("此商品沒有可買規格");
      let vid = variantHint ? Number(variantHint) : variants[0].id;
      if (!variants.some((v) => v.id === vid)) vid = variants[0].id;
      const existing = items.find((it) => it.handle === product.handle && it.variantId === vid);
      if (existing) {
        existing.qty += 1;
        return existing;
      }
      const item = {
        id: product.handle + ":" + vid + ":" + Date.now(),
        handle: product.handle,
        title: product.title,
        vendor: product.vendor || "",
        type: product.product_type || "",
        temp: tempKey(product),
        url: "https://www.papazao.tw" + (product.url || `/products/${product.handle}`),
        image: imgUrl(product, variants.find((v) => v.id === vid) || variants[0]),
        variants: variants.map((v) => ({
          id: v.id,
          title: v.title || v.option1 || "預設",
          price: Number(v.price) || 0,
          available: !!v.available,
          stock: v.inventory_quantity,
        })),
        variantId: vid,
        qty: 1,
        who: "",
      };
      items.push(item);
      return item;
    }

    function currentVariant(item) {
      return item.variants.find((v) => v.id === item.variantId) || item.variants[0];
    }

    function lineTotal(item) {
      return currentVariant(item).price * item.qty;
    }

    function persist() {
      localStorage.setItem(KEY, JSON.stringify(items));
    }

    function restore() {
      try {
        const raw = localStorage.getItem(KEY);
        if (raw) items = JSON.parse(raw);
      } catch (_) {}
    }

    function render() {
      const list = $("list");
      const empty = $("empty");
      list.innerHTML = "";
      empty.style.display = items.length ? "none" : "block";

      items.forEach((item, idx) => {
        const v = currentVariant(item);
        const card = document.createElement("article");
        card.className = "card";
        const stockNote = v.available === false
          ? '<span class="pill out">目前無法購買</span>'
          : (typeof v.stock === "number" ? `<span class="pill">庫存 ${v.stock}</span>` : "");
        const opts = item.variants.map((opt) =>
          `<option value="${opt.id}" ${opt.id === item.variantId ? "selected" : ""}>${escapeHtml(opt.title)} · ${money(opt.price)}</option>`
        ).join("");
        card.innerHTML = `
          <img class="thumb" alt="" src="${item.image || ""}" />
          <div>
            <p class="title">${escapeHtml(item.title)}</p>
            <div class="meta">
              <span>${escapeHtml(item.vendor)}</span>
              <span class="pill">${SHIP[item.temp]?.label || "常溫"}</span>
              ${stockNote}
            </div>
            <div class="controls">
              ${item.variants.length > 1 ? `<select data-i="${idx}" data-k="variant">${opts}</select>` : `<span class="hint" style="margin:0">${escapeHtml(v.title)}</span>`}
              <div class="qty">
                <button type="button" data-i="${idx}" data-k="minus">−</button>
                <input inputmode="numeric" data-i="${idx}" data-k="qty" value="${item.qty}" />
                <button type="button" data-i="${idx}" data-k="plus">+</button>
              </div>
              <label class="who"><input data-i="${idx}" data-k="who" placeholder="誰要買" value="${escapeHtml(item.who)}" /></label>
              <div class="card-actions">
                <a class="icon-btn" href="${item.url}" target="_blank" rel="noopener" title="開原頁">↗</a>
                <button class="icon-btn" data-i="${idx}" data-k="del" title="移除">✕</button>
              </div>
              <div class="line-price">${money(lineTotal(item))}</div>
            </div>
          </div>`;
        list.appendChild(card);
      });

      const grand = items.reduce((s, it) => s + lineTotal(it), 0);
      const qtySum = items.reduce((s, it) => s + it.qty, 0);
      $("grand").textContent = money(grand);
      $("countLine").textContent = `${items.length} 項商品 · ${qtySum} 件`;

      const byTemp = { normal: 0, refrigerated: 0, frozen: 0 };
      items.forEach((it) => { byTemp[it.temp] = (byTemp[it.temp] || 0) + lineTotal(it); });
      const usedTemps = Object.keys(byTemp).filter((k) => byTemp[k] > 0);
      $("bars").innerHTML = usedTemps.map((k) => {
        const rule = SHIP[k];
        const amt = byTemp[k];
        const pct = Math.min(100, (amt / rule.home) * 100);
        const cvsLeft = Math.max(0, rule.cvs - amt);
        const homeLeft = Math.max(0, rule.home - amt);
        const note = amt >= rule.home
          ? "宅配／超商皆已達免運"
          : amt >= rule.cvs
            ? `超商已免運 · 宅配還差 ${money(homeLeft)}`
            : `超商還差 ${money(cvsLeft)} · 宅配還差 ${money(homeLeft)}`;
        return `<div class="bar-row"><span>${rule.label}</span><div class="bar"><span style="width:${pct}%"></span></div><span>${note}</span></div>`;
      }).join("") || `<div class="hint" style="margin:0">加入商品後會顯示免運進度</div>`;

      $("shipHint").innerHTML = `
        <div class="hint" style="margin:0">常溫／冷藏：超商滿 ${money(1500)}、宅配滿 ${money(3000)}</div>
        <div class="hint" style="margin:0">冷凍：超商滿 ${money(2500)}、宅配滿 ${money(5000)}</div>
        <div class="hint">目前常溫 ${money(byTemp.normal + byTemp.refrigerated)}　冷凍 ${money(byTemp.frozen)}</div>`;

      const buckets = {};
      items.forEach((it) => {
        const name = (it.who || "").trim() || "未指定";
        buckets[name] = (buckets[name] || 0) + lineTotal(it);
      });
      const names = Object.keys(buckets);
      $("members").innerHTML = items.length
        ? names.map((n) => `<div class="member-row"><span>${escapeHtml(n)}</span><strong>${money(buckets[n])}</strong></div>`).join("")
        : `<div class="hint">尚未填寫名字</div>`;
    }

    function escapeHtml(s) {
      return String(s || "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function buildCopyText() {
      const lines = ["🛒 農會趴趴灶團購清單", ""];
      items.forEach((it, i) => {
        const v = currentVariant(it);
        const who = it.who ? `（${it.who}）` : "";
        lines.push(`${i + 1}. ${it.title}${who}`);
        lines.push(`   ${v.title} × ${it.qty} ＝ ${money(lineTotal(it))}`);
        lines.push(`   ${it.url}`);
      });
      const grand = items.reduce((s, it) => s + lineTotal(it), 0);
      const byTemp = { normal: 0, frozen: 0, refrigerated: 0 };
      items.forEach((it) => { byTemp[it.temp] += lineTotal(it); });
      lines.push("");
      lines.push(`合計 ${money(grand)}`);
      if (byTemp.normal + byTemp.refrigerated) lines.push(`常溫／冷藏小計 ${money(byTemp.normal + byTemp.refrigerated)}`);
      if (byTemp.frozen) lines.push(`冷凍小計 ${money(byTemp.frozen)}`);
      const buckets = {};
      items.forEach((it) => {
        const name = (it.who || "").trim();
        if (!name) return;
        buckets[name] = (buckets[name] || 0) + lineTotal(it);
      });
      const named = Object.keys(buckets);
      if (named.length) {
        lines.push("");
        lines.push("分帳：");
        named.forEach((n) => lines.push(`- ${n} ${money(buckets[n])}`));
      }
      lines.push("");
      lines.push("免運：常溫超商1500／宅配3000；冷凍超商2500／宅配5000。不同溫層不合併。");
      return lines.join("\n");
    }

    $("list").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-k]");
      if (!btn) return;
      const i = Number(btn.dataset.i);
      const item = items[i];
      if (!item) return;
      if (btn.dataset.k === "plus") item.qty += 1;
      if (btn.dataset.k === "minus") item.qty = Math.max(1, item.qty - 1);
      if (btn.dataset.k === "del") items.splice(i, 1);
      persist(); render();
    });

    $("list").addEventListener("input", (e) => {
      const el = e.target.closest("[data-k]");
      if (!el) return;
      const i = Number(el.dataset.i);
      const item = items[i];
      if (!item) return;
      if (el.dataset.k === "qty") {
        const n = parseInt(el.value, 10);
        item.qty = Number.isFinite(n) && n > 0 ? n : 1;
      }
      if (el.dataset.k === "who") item.who = el.value;
      persist(); render();
    });

    $("list").addEventListener("change", (e) => {
      const el = e.target.closest("[data-k=variant]");
      if (!el) return;
      const item = items[Number(el.dataset.i)];
      if (!item) return;
      item.variantId = Number(el.value);
      persist(); render();
    });

    $("btnSample").onclick = () => { $("urls").value = SAMPLE.join("\n"); };
    $("btnClearUrls").onclick = () => { $("urls").value = ""; };
    $("btnReset").onclick = () => {
      if (items.length && !confirm("確定清空全部商品？")) return;
      items = []; persist(); render();
    };

    $("btnLoad").onclick = async () => {
      const found = parseUrls($("urls").value);
      if (!found.length) {
        $("status").className = "status err";
        $("status").textContent = "沒有辨識到 papazao.tw/products/ 網址。";
        return;
      }
      $("status").className = "status";
      $("status").textContent = `正在讀取 ${found.length} 筆商品…`;
      let ok = 0, fail = 0;
      const errors = [];
      for (const row of found) {
        try {
          const product = await loadProduct(row.handle);
          addProduct(product, row.variantHint);
          ok += 1;
          persist(); render();
          $("status").textContent = `已加入 ${ok} / ${found.length}…`;
        } catch (e) {
          fail += 1;
          errors.push(row.handle);
        }
      }
      $("status").className = fail ? "status err" : "status ok";
      $("status").textContent = fail
        ? `成功 ${ok} 筆，失敗 ${fail} 筆（${errors.join("、")}）。若直接開檔案被擋，請改跑 python3 server.py。`
        : `已加入 ${ok} 筆商品，可調整規格與數量。`;
    };

    function openCopy() {
      $("copyText").textContent = buildCopyText();
      $("dlg").showModal();
      const range = document.createRange();
      range.selectNodeContents($("copyText"));
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    $("btnCopy").onclick = openCopy;
    $("btnCopy2").onclick = openCopy;
    $("btnClose").onclick = () => $("dlg").close();
    $("btnDoCopy").onclick = async () => {
      try {
        await navigator.clipboard.writeText(buildCopyText());
        $("btnDoCopy").textContent = "已複製";
        setTimeout(() => { $("btnDoCopy").textContent = "複製"; }, 1200);
      } catch (_) {
        document.execCommand("copy");
      }
    };

    restore();
    render();
  </script>
</body>
</html>
