<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1035">
<title>阿毛彈珠台 🐶🎯</title>
<style>
:root{
  --ink:#17112b; --deep:#160f31; --panel:#2a1b52; --purple:#6e45d8;
  --pink:#ff4f9a; --cyan:#42e8ff; --gold:#ffd65a; --cream:#fff8df;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090712}
body{
  font-family:ui-rounded,"SF Pro Rounded","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  display:grid;place-items:center;color:#fff;
}
#app{width:100%;height:100%;display:grid;place-items:center;position:relative}
#cabinet{
  position:relative;height:100dvh;width:min(100vw,620px);
  background:linear-gradient(180deg,#3d2773 0,#211342 22%,#0e0921 100%);
  overflow:hidden;
}
#cabinet:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(circle at 12% 9%,rgba(255,255,255,.18) 0 2px,transparent 3px),
    radial-gradient(circle at 83% 15%,rgba(66,232,255,.22) 0 2px,transparent 3px),
    radial-gradient(circle at 30% 67%,rgba(255,79,154,.18) 0 2px,transparent 3px);
  background-size:80px 90px,100px 110px,130px 140px;opacity:.65;
}
#hud{
  position:absolute;z-index:20;left:10px;right:10px;top:10px;
  height:62px;display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:7px;
}
.stat{
  min-width:0;padding:7px 9px;border:2px solid rgba(255,255,255,.22);
  border-radius:17px;background:rgba(20,11,49,.78);backdrop-filter:blur(8px);
  box-shadow:0 5px 0 rgba(0,0,0,.28),inset 0 0 18px rgba(130,85,255,.12);
}
.stat small{display:block;color:#c9bde9;font-size:10px;font-weight:800;letter-spacing:.08em}
.stat b{display:block;margin-top:1px;font-size:19px;line-height:1.1;color:#fff}
.stat.score b{color:var(--gold);text-shadow:0 0 9px rgba(255,214,90,.35)}
#lives b{color:#ff83b5}

#boardWrap{
  position:absolute;left:7px;right:7px;top:78px;bottom:8px;
  border:7px solid #a95725;border-radius:34px;
  background:linear-gradient(135deg,#ffd75e,#ff9d32 42%,#8e3c1d);
  box-shadow:0 9px 0 #542010,0 18px 35px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.55);
}
#board{
  position:absolute;inset:7px;border-radius:24px;overflow:hidden;
  background:#130c2d;
  border:3px solid rgba(255,255,255,.13);
}
canvas{width:100%;height:100%;display:block;touch-action:none}
#titlePlate{
  position:absolute;z-index:5;top:9px;left:11%;right:16%;height:58px;
  border:3px solid var(--gold);border-radius:17px;
  background:linear-gradient(180deg,#4c2b86,#211044);
  box-shadow:0 4px 0 #120a25,0 0 18px rgba(255,214,90,.2),inset 0 0 20px rgba(100,60,220,.22);
  display:flex;align-items:center;justify-content:center;gap:8px;
  pointer-events:none;
}
#titlePlate .paw{font-size:25px}
#titlePlate strong{font-size:22px;letter-spacing:.08em;color:#fff;text-shadow:0 2px 0 #130a2a,0 0 9px rgba(255,255,255,.25)}
#titlePlate span{font-size:11px;color:#cfc2f5;font-weight:800}

#mascot{
  position:absolute;z-index:7;left:8px;bottom:105px;width:104px;height:135px;
  pointer-events:none;filter:drop-shadow(0 7px 4px rgba(0,0,0,.42));
}
#mascot img{width:100%;height:100%;object-fit:contain;object-position:center bottom}
#mascot .tag{
  position:absolute;left:8px;bottom:0;padding:4px 9px;border-radius:999px;
  background:#fff3b0;color:#3b1e19;border:2px solid #8e3c1d;font-size:12px;font-weight:1000;
  transform:rotate(-4deg);
}
#mascot .bubble{
  position:absolute;top:-5px;right:-13px;background:#fff;color:#27153e;border:2px solid #6e45d8;
  border-radius:12px;padding:4px 7px;font-size:10px;font-weight:1000;white-space:nowrap;
  box-shadow:0 3px 0 rgba(0,0,0,.3);transform:rotate(5deg)
}

#launcher{
  position:absolute;z-index:8;right:5px;bottom:8px;width:67px;top:74px;
  border-left:3px solid rgba(255,255,255,.18);
  background:linear-gradient(180deg,rgba(10,6,29,.45),rgba(44,19,82,.72));
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 5px 8px;
}
#laneLabel{font-size:9px;color:#cbbcf0;font-weight:900;writing-mode:vertical-rl;letter-spacing:.12em;margin-bottom:auto;margin-top:10px}
#chargeMeter{width:10px;height:115px;border:2px solid #fff;border-radius:9px;background:#10091f;overflow:hidden;display:flex;align-items:flex-end;box-shadow:0 0 9px rgba(66,232,255,.2)}
#chargeFill{width:100%;height:0;background:linear-gradient(0deg,#ff4f9a,#ffd65a,#42e8ff);box-shadow:0 0 10px #ffd65a;transition:height .05s}
#launchBtn{
  width:52px;height:52px;border-radius:50%;border:3px solid #fff1b5;
  background:radial-gradient(circle at 35% 28%,#fff9d7 0 10%,#ffd65a 38%,#ff8c28 76%,#a7441d 100%);
  color:#4d2512;font-weight:1000;font-size:13px;line-height:1.05;
  box-shadow:0 6px 0 #6f2815,0 0 16px rgba(255,154,45,.35);
  cursor:pointer;user-select:none;touch-action:none;
}
#launchBtn:active{transform:translateY(5px);box-shadow:0 1px 0 #6f2815,0 0 12px rgba(255,154,45,.3)}
#launchBtn .tiny{display:block;font-size:8px;margin-top:2px}
#autoBtn{
  margin-top:8px;width:52px;height:30px;border-radius:12px;border:2px solid #8c7abf;
  background:#241544;color:#cfc5eb;font-size:10px;font-weight:1000;cursor:pointer;
}
#autoBtn.on{background:#ff4f9a;border-color:#fff;color:#fff;box-shadow:0 0 12px rgba(255,79,154,.55)}
#modeRow{
  position:absolute;z-index:9;left:14px;right:78px;bottom:11px;height:50px;
  display:flex;align-items:center;gap:6px;
}
.mode{
  flex:0 0 auto;min-width:52px;height:38px;border:2px solid #725ca8;border-radius:13px;
  background:rgba(30,16,62,.9);color:#d8cff1;font-weight:1000;cursor:pointer;
  box-shadow:0 4px 0 #0d081d;font-size:13px;
}
.mode.active{background:linear-gradient(180deg,#6f45d9,#40228b);border-color:#bba5ff;color:#fff;box-shadow:0 4px 0 #21104e,0 0 13px rgba(111,69,217,.4)}
#hint{
  position:absolute;z-index:15;left:50%;top:72px;transform:translateX(-50%);
  font-size:10px;font-weight:900;color:#d7ccf2;background:rgba(17,8,36,.72);
  border:1px solid rgba(255,255,255,.13);padding:4px 9px;border-radius:999px;
  white-space:nowrap;pointer-events:none;opacity:.9
}
#toast{position:absolute;z-index:30;left:50%;top:26%;transform:translate(-50%,-50%);pointer-events:none;font-size:30px;font-weight:1000;color:#fff;text-shadow:0 3px 0 #2a124d,0 0 15px rgba(255,214,90,.8);opacity:0}
#toast.show{animation:toast .8s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-35%) scale(.7)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-105%) scale(1)}}
#gameover{
  position:absolute;z-index:40;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(8,4,20,.78);backdrop-filter:blur(5px)
}
#gameover.show{display:flex}
.modal{
  width:min(86%,360px);padding:25px 22px;border-radius:24px;border:3px solid var(--gold);
  background:linear-gradient(180deg,#3c2370,#160c31);text-align:center;box-shadow:0 10px 0 #090512,0 0 35px rgba(255,79,154,.18)
}
.modal h2{margin:0 0 6px;font-size:28px;color:#ffd65a}
.modal p{margin:5px 0 17px;color:#d7ccf2;font-weight:700}
#restart{border:0;border-radius:14px;padding:12px 22px;background:linear-gradient(180deg,#ff6aa9,#d92d75);color:#fff;font-weight:1000;font-size:15px;box-shadow:0 5px 0 #74173e;cursor:pointer}

@media (min-width:621px){
  #cabinet{height:min(100dvh,1050px);border-radius:28px;box-shadow:0 0 0 1px #5b3b91,0 20px 70px #000}
}
@media (max-height:720px){
  #hud{height:54px}.stat b{font-size:16px}
  #boardWrap{top:68px}.titlePlate{height:48px}
  #mascot{width:78px;height:100px;bottom:88px}
  #launcher{top:60px}
  #modeRow{height:44px}
}
</style>
</head>

<script>

'use strict';

/* =========================================================
   阿毛彈珠台
   - 純 Canvas + JavaScript，單檔可直接執行
   - 無彈珠庫存上限
   - ×3 / ×5 / ×10 會真的同時生成對應數量
   - 長按發射鍵／Space：連續發射
   - 自動射擊
   - 左右 Flippers：←/A、→/D
   ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

/* ---------- state ---------- */
let score = 0;
let high = Number(localStorage.getItem('amoPinballHigh') || 0);
let lives = 5;
let selectedCount = 1;
let firing = false;
let autoFire = false;
let fireTimer = 0;
let charge = 0;
let last = performance.now();
let shake = 0;
let gameEnded = false;

const balls = [];
const particles = [];
const flashes = [];
const pressed = new Set();

document.getElementById('high').textContent = high.toLocaleString();

function updateHUD(){
  document.getElementById('score').textContent = score.toLocaleString();
  document.getElementById('high').textContent = high.toLocaleString();
  document.getElementById('lifeText').textContent = '❤'.repeat(Math.max(0,lives)) + '♡'.repeat(Math.max(0,5-lives));
}
function addScore(n, x, y, label=''){
  score += n;
  if(score > high){
    high = score;
    localStorage.setItem('amoPinballHigh', String(high));
  }
  if(label) toast(label + '  +' + n.toLocaleString(), x, y);
  updateHUD();
}
function toast(text,x=W/2,y=300){
  const el=document.getElementById('toast');
  el.textContent=text;
  el.style.left=(x/W*100)+'%';
  el.style.top=(Math.max(12,Math.min(70,y/H*100)))+'%';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

/* ---------- board geometry ---------- */
const launchLane = {x1:445,x2:515,y1:78,y2:900, centerX:478, curveCx:428, curveCy:150, curveR:50};
const play = {x1:18,x2:438,y1:80,y2:925};

// Lower apron / guard-rail geometry. The only real drain is the central
// opening directly underneath the two flippers. Everything else is walled in.
const lowerRails = {
  left:[
    [{x:18,y:900},{x:72,y:934}],
    [{x:72,y:934},{x:150,y:958}],
    [{x:150,y:958},{x:188,y:970}]
  ],
  right:[
    [{x:438,y:900},{x:384,y:934}],
    [{x:384,y:934},{x:306,y:958}],
    [{x:306,y:958},{x:268,y:970}]
  ],
  drain:{x1:188,x2:268,y:970}
};

const pegs = [];
const bumpers = [
  {x:110,y:230,r:31,value:100,flash:0},
  {x:250,y:190,r:34,value:250,flash:0},
  {x:365,y:245,r:31,value:150,flash:0},
  {x:145,y:355,r:29,value:200,flash:0},
  {x:310,y:355,r:29,value:300,flash:0},
  {x:225,y:470,r:38,value:500,flash:0}
];

const triangles = [
  {a:{x:55,y:500},b:{x:145,y:585},c:{x:52,y:610},value:80},
  {a:{x:390,y:500},b:{x:300,y:585},c:{x:393,y:610},value:80},
  {a:{x:92,y:690},b:{x:210,y:610},c:{x:160,y:730},value:120},
  {a:{x:345,y:690},b:{x:230,y:610},c:{x:280,y:730},value:120}
];

for(let row=0;row<11;row++){
  const y=105+row*42;
  const offset=(row%2)*20;
  for(let col=0;col<10;col++){
    const x=38+col*40+offset;
    if(x>425) continue;
    if(Math.hypot(x-250,y-190)<58) continue;
    if(Math.hypot(x-225,y-470)<60) continue;
    pegs.push({x,y,r:6});
  }
}

/* ---------- flippers ---------- */
const flippers = {
  left:{pivot:{x:154,y:858},len:112,rest:-0.28,active:-0.98,angle:-0.28,vel:0},
  right:{pivot:{x:292,y:858},len:112,rest:Math.PI+0.28,active:Math.PI+0.98,angle:Math.PI+0.28,vel:0}
};

function flipperEnd(f){
  return {x:f.pivot.x+Math.cos(f.angle)*f.len, y:f.pivot.y+Math.sin(f.angle)*f.len};
}

/* ---------- physics helpers ---------- */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function len(x,y){return Math.hypot(x,y)}
function dot(ax,ay,bx,by){return ax*bx+ay*by}

function reflectBallFromCircle(b,c,r,boost=1){
  let dx=b.x-c.x, dy=b.y-c.y, d=Math.hypot(dx,dy)||.001;
  const nx=dx/d, ny=dy/d;
  b.x=c.x+nx*(r+b.r+0.6); b.y=c.y+ny*(r+b.r+0.6);
  const vn=b.vx*nx+b.vy*ny;
  if(vn<0){
    b.vx-=1.95*vn*nx; b.vy-=1.95*vn*ny;
  }
  b.vx*=boost; b.vy*=boost;
}

function closestPointSegment(px,py,ax,ay,bx,by){
  const dx=bx-ax,dy=by-ay;
  const t=clamp(((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy),0,1);
  return {x:ax+t*dx,y:ay+t*dy,t};
}
function collideSegment(b, ax,ay,bx,by, kick=0){
  const q=closestPointSegment(b.x,b.y,ax,ay,bx,by);
  const dx=b.x-q.x,dy=b.y-q.y,d=Math.hypot(dx,dy);
  if(d < b.r+2){
    const nx=d?dx/d:0, ny=d?dy/d:-1;
    b.x=q.x+nx*(b.r+2.4); b.y=q.y+ny*(b.r+2.4);
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){ b.vx-=1.9*vn*nx; b.vy-=1.9*vn*ny; }
    if(kick){ b.vx+=nx*kick; b.vy+=ny*kick; }
    return true;
  }
  return false;
}
function pointInTriangle(p,t){
  const sign=(p1,p2,p3)=>(p1.x-p3.x)*(p2.y-p3.y)-(p2.x-p3.x)*(p1.y-p3.y);
  const d1=sign(p,t.a,t.b),d2=sign(p,t.b,t.c),d3=sign(p,t.c,t.a);
  return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}

function collideLowerRails(b){
  let hit=false;
  for(const side of [lowerRails.left, lowerRails.right]){
    for(const seg of side){
      if(collideSegment(b,seg[0].x,seg[0].y,seg[1].x,seg[1].y,0)) hit=true;
    }
  }
  // Short horizontal lips at the two sides of the drain keep the ball from
  // slipping around the end of a rail. The center opening is intentionally left open.
  if(b.y > lowerRails.drain.y - b.r - 1){
    if(b.x < lowerRails.drain.x1 + b.r && b.x > lowerRails.drain.x1 - 18){
      if(collideSegment(b,lowerRails.drain.x1,lowerRails.drain.y,lowerRails.drain.x1,lowerRails.drain.y-20,0)) hit=true;
    }
    if(b.x > lowerRails.drain.x2 - b.r && b.x < lowerRails.drain.x2 + 18){
      if(collideSegment(b,lowerRails.drain.x2,lowerRails.drain.y,lowerRails.drain.x2,lowerRails.drain.y-20,0)) hit=true;
    }
  }
  return hit;
}

/* ---------- balls ---------- */
let nextBallId=1;
function spawnBall(){
  // 真正的右側發射道：先沿直線高速上升，再繞過右上方 90° 彎道，
  // 最後以向左的水平速度切入主台面。這就是一般彈珠台常見的 shooter lane → top arc → playfield 動線。
  const b={
    id:nextBallId++, x:launchLane.centerX, y:875,
    r:7.2, vx:0, vy:-14.5,
    launchPhase:'up', launchT:0,
    life:0, trail:[], hitCooldown:0, alive:true
  };
  balls.push(b);
}
function fireVolley(){
  if(gameEnded) return;
  const n=selectedCount;
  // ×3 / ×5 / ×10 are actual simultaneous balls.
  for(let i=0;i<n;i++) spawnBall();
  addScore(5*n,455,850,'發射！');
}
function startFiring(){
  if(gameEnded) return;
  if(!firing){ firing=true; charge=0; fireVolley(); fireTimer=0.16; }
}
function stopFiring(){firing=false;charge=0}
function updateFiring(dt){
  if(firing){
    charge=clamp(charge+dt*1.9,0,1);
    fireTimer-=dt;
    if(fireTimer<=0){ fireVolley(); fireTimer=0.19; }
  }else charge=0;
  if(autoFire && !firing){
    fireTimer-=dt;
    if(fireTimer<=0){ fireVolley(); fireTimer=.72; }
  }
  document.getElementById('chargeFill').style.height=(charge*100)+'%';
}

/* ---------- scoring collisions ---------- */
function bumperHit(b,c){
  if(c.flash>0) return;
  c.flash=.18;
  addScore(c.value,c.x,c.y-18,'BUMP!');
  shake=Math.max(shake,7);
  burst(c.x,c.y,10);
}
function triangleHit(t){
  addScore(t.value, (t.a.x+t.b.x+t.c.x)/3, (t.a.y+t.b.y+t.c.y)/3,'TRIANGLE!');
  shake=Math.max(shake,3);
}

/* ---------- particle FX ---------- */
function burst(x,y,n=8){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:.5+Math.random()*.35,size:2+Math.random()*4});
  }
}
function updateFx(dt){
  for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=13*dt;p.vx*=.985;p.life-=dt}
  while(particles.length && particles[0].life<=0) particles.shift();
  for(const f of flashes) f.t-=dt;
  while(flashes.length&&flashes[0].t<=0)flashes.shift();
}

/* ---------- ball update ---------- */
function updateBall(b,dt){
  b.life+=dt; b.hitCooldown-=dt;

  /* -------------------------------------------------------
     Shooter lane path
     Phase 1: vertical acceleration up the right lane.
     Phase 2: a 90° quarter-circle at the top.
     Phase 3: release into the main playfield with a leftward tangent.
     ------------------------------------------------------- */
  if(b.launchPhase){
    if(b.launchPhase==='up'){
      b.x=launchLane.centerX;
      b.vx=0;
      b.vy=-14.5;
      b.y += b.vy*dt*60;
      if(b.y <= launchLane.curveCy){
        b.launchPhase='curve';
        b.launchT=0;
      }
    }else if(b.launchPhase==='curve'){
      // θ: 0 → -90°.  The tangent changes smoothly from UP to LEFT.
      const arcSpeed=2.9; // radians / second
      b.launchT=Math.min(1,b.launchT + (arcSpeed*dt)/(Math.PI/2));
      const theta=-(Math.PI/2)*b.launchT;
      const cx=launchLane.curveCx, cy=launchLane.curveCy, r=launchLane.curveR;
      b.x=cx+r*Math.cos(theta);
      b.y=cy+r*Math.sin(theta);

      // Tangent of the arc; keep the ball glued to the guide while turning.
      const dtheta=-(Math.PI/2)*arcSpeed/(Math.PI/2);
      const tx=-r*Math.sin(theta)*dtheta;
      const ty= r*Math.cos(theta)*dtheta;
      const tm=Math.hypot(tx,ty)||1;
      const launchSpeed=13.2;
      b.vx=tx/tm*launchSpeed;
      b.vy=ty/tm*launchSpeed;

      if(b.launchT>=1){
        // Release exactly at the leftward tangent of the curve.
        b.launchPhase='released';
        b.x=launchLane.curveCx-launchLane.curveR-b.r-1;
        b.y=launchLane.curveCy-b.r-1;
        b.vx=-13.2;
        b.vy=0.9;
      }
    }

    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>9)b.trail.shift();
    if(b.launchPhase!=='released') return;
  }

  // gravity + tiny air drag
  b.vy += 24*dt;
  b.vx *= Math.pow(.999,dt*60); b.vy *= Math.pow(.9995,dt*60);
  const speed=Math.hypot(b.vx,b.vy);
  if(speed>24){b.vx*=24/speed;b.vy*=24/speed}
  b.x+=b.vx*dt*60; b.y+=b.vy*dt*60;

  if(b.life<.3){ b.trail=[]; }
  b.trail.push({x:b.x,y:b.y}); if(b.trail.length>7)b.trail.shift();

  // Main playfield walls. IMPORTANT: the playfield has a CONTINUOUS
  // left/right cabinet wall all the way down to the lower apron.
  // The shooter lane is outside this wall; once the ball exits the top arc,
  // it is inside the main cabinet and must never be able to fly out sideways.
  if(b.x-b.r<play.x1){
    b.x=play.x1+b.r;
    b.vx=Math.abs(b.vx)*.94;
  }
  if(b.x+b.r>play.x2){
    b.x=play.x2-b.r;
    b.vx=-Math.max(3.8,Math.abs(b.vx)*.94);
  }
  if(b.y-b.r<play.y1){
    b.y=play.y1+b.r;
    b.vy=Math.abs(b.vy)*.92;
  }

  // Lower apron rails: balls may NOT fall through the sides.
  collideLowerRails(b);

  // pegs
  for(const p of pegs){
    const d=Math.hypot(b.x-p.x,b.y-p.y);
    if(d<b.r+p.r){
      reflectBallFromCircle(b,p,p.r,1.035);
      if(b.hitCooldown<=0){ addScore(10,p.x,p.y-10); b.hitCooldown=.055; }
    }
  }

  // bumpers
  for(const c of bumpers){
    if(Math.hypot(b.x-c.x,b.y-c.y)<b.r+c.r){
      reflectBallFromCircle(b,c,c.r,1.12);
      b.vx += (b.x-c.x)*.025; b.vy += (b.y-c.y)*.025;
      if(b.hitCooldown<=0){bumperHit(b,c);b.hitCooldown=.08}
    }
  }

  // triangle slingshots
  for(const t of triangles){
    const edges=[[t.a,t.b],[t.b,t.c],[t.c,t.a]];
    let hit=false;
    for(const [a,c] of edges) if(collideSegment(b,a.x,a.y,c.x,c.y,1.3)) hit=true;
    if(hit && b.hitCooldown<=0){triangleHit(t);b.hitCooldown=.08}
  }

  // flippers
  for(const f of [flippers.left,flippers.right]){
    const e=flipperEnd(f);
    const hit=collideSegment(b,f.pivot.x,f.pivot.y,e.x,e.y,0);
    if(hit){
      const kick=f.vel*0.045;
      b.vy -= 4 + Math.abs(kick)*0.5;
      b.vx += Math.cos(f.angle)*kick;
      b.vy += Math.sin(f.angle)*kick;
    }
  }

  // Drain: the ONLY place a ball can leave the table.
  // It is the central opening directly below the two flippers.
  if(b.y > lowerRails.drain.y + 18 && b.x > lowerRails.drain.x1 && b.x < lowerRails.drain.x2){
    b.alive=false;
    loseLife();
  }
  // Absolute safety net: never allow a ball to disappear outside the cabinet.
  if(b.y > H + 20){
    b.alive=false;
    loseLife();
  }
}
function loseLife(){
  lives--;
  burst(250,925,20);
  shake=12;
  updateHUD();
  if(lives<=0){
    gameEnded=true;
    document.getElementById('finalScore').textContent=score.toLocaleString();
    document.getElementById('gameover').classList.add('show');
  }else{
    toast('阿毛救回一條命！',250,820);
  }
}

/* ---------- flipper update ---------- */
function updateFlippers(dt){
  const L=pressed.has('ArrowLeft')||pressed.has('a')||pressed.has('A');
  const R=pressed.has('ArrowRight')||pressed.has('d')||pressed.has('D');
  for(const [name,f] of Object.entries(flippers)){
    const target=name==='left'?(L?f.active:f.rest):(R?f.active:f.rest);
    let old=f.angle;
    f.angle += (target-f.angle)*Math.min(1,dt*22);
    f.vel=(f.angle-old)/Math.max(dt,.001);
  }
}

/* ---------- drawing ---------- */
function rr(x,y,w,h,r){
  const q=Math.min(r,w/2,h/2);ctx.beginPath();
  ctx.moveTo(x+q,y);ctx.arcTo(x+w,y,x+w,y+h,q);ctx.arcTo(x+w,y+h,x,y+h,q);
  ctx.arcTo(x,y+h,x,y,q);ctx.arcTo(x,y,x+w,y,q);ctx.closePath();
}
function glowCircle(x,y,r,fill,stroke=fill){
  ctx.save();ctx.shadowBlur=18;ctx.shadowColor=stroke;ctx.fillStyle=fill;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke();ctx.restore();
}
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2b1760');g.addColorStop(.46,'#140b34');g.addColorStop(1,'#08051a');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // neon star field
  for(let i=0;i<75;i++){
    const x=(i*83)%430+5,y=(i*137)%820+90;
    ctx.fillStyle=i%5===0?'rgba(66,232,255,.38)':'rgba(255,255,255,.18)';
    ctx.fillRect(x,y,2,2);
  }
  // central ornamental rings
  ctx.strokeStyle='rgba(119,78,219,.16)';ctx.lineWidth=3;
  for(let r=90;r<340;r+=52){ctx.beginPath();ctx.arc(225,500,r,0,Math.PI*2);ctx.stroke()}
}
function drawLane(){
  const L=launchLane;
  ctx.save();
  ctx.fillStyle='rgba(4,2,15,.68)';
  ctx.fillRect(L.x1,75,L.x2-L.x1,900);

  // Shooter lane rails: straight vertical guide + a rounded 90° top return.
  ctx.strokeStyle='#42e8ff';ctx.lineWidth=4;ctx.shadowBlur=14;ctx.shadowColor='#42e8ff';
  ctx.beginPath();
  ctx.moveTo(L.x1,88);ctx.lineTo(L.x1,900);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(L.x2,900);ctx.lineTo(L.x2,150);
  ctx.arc(L.curveCx,L.curveCy,L.curveR+37,0, -Math.PI/2,true);
  ctx.stroke();
  ctx.shadowBlur=0;

  // Inner launch guide and top arc.
  ctx.strokeStyle='#ffd65a';ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(L.centerX,880);ctx.lineTo(L.centerX,L.curveCy);
  ctx.arc(L.curveCx,L.curveCy,L.curveR,0,-Math.PI/2,true);
  ctx.stroke();

  // Dashed lane markers make the intended travel direction obvious.
  for(let y=185;y<820;y+=52){
    ctx.fillStyle='rgba(66,232,255,.28)';
    ctx.beginPath();ctx.arc(L.centerX,y,4,0,Math.PI*2);ctx.fill();
  }

  // Arrow showing the ball's final leftward exit.
  ctx.fillStyle='rgba(255,214,90,.75)';
  ctx.beginPath();ctx.moveTo(392,108);ctx.lineTo(418,96);ctx.lineTo(418,104);ctx.lineTo(438,104);ctx.lineTo(438,112);ctx.lineTo(418,112);ctx.lineTo(418,120);ctx.closePath();ctx.fill();

  // MAIN CABINET GUARD RAILS — these are intentionally continuous.
  // They visually match the physical collision walls used in updateBall().
  ctx.lineCap='round';
  ctx.lineWidth=16;ctx.strokeStyle='#24133e';ctx.shadowBlur=14;ctx.shadowColor='#42e8ff';
  ctx.beginPath();ctx.moveTo(play.x1,86);ctx.lineTo(play.x1,900);ctx.stroke();
  ctx.beginPath();ctx.moveTo(play.x2,86);ctx.lineTo(play.x2,900);ctx.stroke();
  ctx.lineWidth=7;ctx.strokeStyle='#42e8ff';ctx.shadowBlur=0;
  ctx.beginPath();ctx.moveTo(play.x1,86);ctx.lineTo(play.x1,900);ctx.stroke();
  ctx.beginPath();ctx.moveTo(play.x2,86);ctx.lineTo(play.x2,900);ctx.stroke();
  ctx.restore();
}
function drawPegs(){
  for(const p of pegs){
    const g=ctx.createRadialGradient(p.x-2,p.y-2,1,p.x,p.y,p.r+2);
    g.addColorStop(0,'#fff');g.addColorStop(.45,'#ffe99a');g.addColorStop(1,'#d17b29');
    ctx.fillStyle=g;ctx.shadowBlur=6;ctx.shadowColor='#ffd65a';
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
  }
}
function drawBumpers(){
  for(const c of bumpers){
    const active=c.flash>0;
    ctx.save();ctx.shadowBlur=active?30:13;ctx.shadowColor=active?'#fff':'#ff4f9a';
    ctx.fillStyle=active?'#fff':'#5a36a9';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;ctx.lineWidth=5;ctx.strokeStyle=active?'#ffd65a':'#b89aff';ctx.stroke();
    ctx.fillStyle=active?'#ff4f9a':'#241342';ctx.beginPath();ctx.arc(c.x,c.y,c.r-9,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='900 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(c.value,c.x,c.y);
    ctx.font='18px system-ui';ctx.fillText('★',c.x,c.y-c.r-9);
    ctx.restore();
  }
}
function drawTriangles(){
  for(const t of triangles){
    ctx.save();ctx.shadowBlur=12;ctx.shadowColor='#ff4f9a';
    ctx.fillStyle='#ff4f9a';ctx.strokeStyle='#ffd65a';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(t.a.x,t.a.y);ctx.lineTo(t.b.x,t.b.y);ctx.lineTo(t.c.x,t.c.y);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff2b0';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('+'+t.value, (t.a.x+t.b.x+t.c.x)/3,(t.a.y+t.b.y+t.c.y)/3);
    ctx.restore();
  }
}
function drawLowerRails(){
  ctx.save();
  // Neon wooden/apron rails around the bottom, leaving only the center drain.
  ctx.lineCap='round';
  for(const side of [lowerRails.left,lowerRails.right]){
    for(const seg of side){
      ctx.lineWidth=18;ctx.strokeStyle='#32184f';ctx.shadowBlur=12;ctx.shadowColor='#ff4f9a';
      ctx.beginPath();ctx.moveTo(seg[0].x,seg[0].y);ctx.lineTo(seg[1].x,seg[1].y);ctx.stroke();
      ctx.lineWidth=9;ctx.strokeStyle='#ffd65a';ctx.shadowBlur=0;
      ctx.beginPath();ctx.moveTo(seg[0].x,seg[0].y);ctx.lineTo(seg[1].x,seg[1].y);ctx.stroke();
    }
  }
  // Drain mouth: clearly visible under the V-shaped flippers.
  const d=lowerRails.drain;
  ctx.shadowBlur=18;ctx.shadowColor='#ff4f9a';
  ctx.fillStyle='#05020e';
  rr(d.x1,d.y-9,d.x2-d.x1,30,13);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='#ff4f9a';ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle='#ffd65a';ctx.font='900 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('DRAIN', (d.x1+d.x2)/2, d.y+5);
  ctx.restore();
}
function drawFlippers(){
  for(const f of [flippers.left,flippers.right]){
    const e=flipperEnd(f);
    ctx.save();ctx.lineCap='round';ctx.lineWidth=20;ctx.strokeStyle='#fff2b0';ctx.shadowBlur=16;ctx.shadowColor='#ffd65a';
    ctx.beginPath();ctx.moveTo(f.pivot.x,f.pivot.y);ctx.lineTo(e.x,e.y);ctx.stroke();
    ctx.lineWidth=12;ctx.strokeStyle='#ff4f9a';ctx.shadowBlur=0;
    ctx.beginPath();ctx.moveTo(f.pivot.x,f.pivot.y);ctx.lineTo(e.x,e.y);ctx.stroke();
    ctx.fillStyle='#42e8ff';ctx.beginPath();ctx.arc(f.pivot.x,f.pivot.y,14,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}
function drawBalls(){
  for(const b of balls){
    ctx.save();
    for(let i=0;i<b.trail.length;i++){
      const p=b.trail[i],a=(i+1)/b.trail.length*.18;
      ctx.fillStyle='rgba(255,214,90,'+a+')';ctx.beginPath();ctx.arc(p.x,p.y,b.r*(i+1)/b.trail.length*.75,0,Math.PI*2);ctx.fill();
    }
    const g=ctx.createRadialGradient(b.x-2,b.y-3,1,b.x,b.y,b.r+2);
    g.addColorStop(0,'#fff');g.addColorStop(.25,'#fff8b5');g.addColorStop(.65,'#ff8dbb');g.addColorStop(1,'#d92d75');
    ctx.shadowBlur=12;ctx.shadowColor='#ff4f9a';ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}
function drawFX(){
  for(const p of particles){
    ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle='#ffd65a';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.2)shake=0}
  drawBackground();
  drawLane();
  drawTriangles();
  drawPegs();
  drawBumpers();
  drawLowerRails();
  drawFlippers();
  drawBalls();
  drawFX();
  // bottom drain glow
  const grd=ctx.createLinearGradient(0,900,0,980);grd.addColorStop(0,'rgba(255,79,154,0)');grd.addColorStop(1,'rgba(255,79,154,.28)');
  ctx.fillStyle=grd;ctx.fillRect(0,900,445,80);
  ctx.restore();
}

/* ---------- main loop ---------- */
function loop(now){
  const dt=Math.min(.025,(now-last)/1000);last=now;
  if(!gameEnded){
    updateFiring(dt);
    updateFlippers(dt);
    for(const b of balls) updateBall(b,dt);
    for(let i=balls.length-1;i>=0;i--) if(!balls[i].alive) balls.splice(i,1);
    for(const c of bumpers) c.flash=Math.max(0,c.flash-dt);
  }
  updateFx(dt);
  draw();
  requestAnimationFrame(loop);
}

/* ---------- input ---------- */
window.addEventListener('keydown',e=>{
  if(['Space','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  pressed.add(e.key);
  if(e.code==='Space') startFiring();
});
window.addEventListener('keyup',e=>{
  pressed.delete(e.key);
  if(e.code==='Space') stopFiring();
});

const launch=document.getElementById('launchBtn');
launch.addEventListener('pointerdown',e=>{e.preventDefault();launch.setPointerCapture?.(e.pointerId);startFiring()});
launch.addEventListener('pointerup',e=>{e.preventDefault();stopFiring()});
launch.addEventListener('pointercancel',stopFiring);
launch.addEventListener('pointerleave',()=>{}); // keep firing while pointer is held
document.querySelectorAll('.mode').forEach(btn=>{
  btn.addEventListener('click',()=>{
    selectedCount=Number(btn.dataset.count);
    document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===btn));
    toast('每次發射 ×'+selectedCount,250,850);
  });
});
document.getElementById('autoBtn').addEventListener('click',()=>{
  autoFire=!autoFire;
  const b=document.getElementById('autoBtn');
  b.classList.toggle('on',autoFire);
  b.textContent=autoFire?'自動中':'自動射擊';
  if(autoFire) fireTimer=0;
});
document.getElementById('restart').addEventListener('click',()=>{
  score=0;lives=5;gameEnded=false;balls.length=0;particles.length=0;
  document.getElementById('gameover').classList.remove('show');
  updateHUD(); toast('阿毛彈珠台！',250,420);
});

/* ---------- responsive canvas hit area ---------- */
canvas.addEventListener('pointerdown',e=>{
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
  if(y>760 && x<230) pressed.add('ArrowLeft');
  if(y>760 && x>=230 && x<445) pressed.add('ArrowRight');
});
canvas.addEventListener('pointerup',()=>{pressed.delete('ArrowLeft');pressed.delete('ArrowRight')});
canvas.addEventListener('pointercancel',()=>{pressed.delete('ArrowLeft');pressed.delete('ArrowRight')});

/* ---------- init ---------- */
updateHUD();
requestAnimationFrame(loop);
})();
</script>
</body>
