 const bytes=Uint8Array.from(atob(item.b64),c=>c.charCodeAt(0));
 const blob=new Blob([bytes],{type:'text/html;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const frame=document.createElement('iframe'); frame.dataset.key=item.key; frame.title=item.label+' 剪貼簿'; frame.src=url; wrap.appendChild(frame); return frame;
}
SOURCES.forEach((item,i)=>{
 const b=document.createElement('button'); b.className='tab'+(i===0?' active':''); b.dataset.key=item.key; b.innerHTML='<span class="ico">'+item.icon+'</span><span>'+item.label+'</span>'; b.onclick=()=>switchTo(item.key); tabs.appendChild(b);
 makeFrame(item);
});
function switchTo(key){
 active=key; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.key===key)); document.querySelectorAll('iframe').forEach(x=>x.classList.toggle('active',x.dataset.key===key)); label.textContent='目前：'+key;
 const b=[...document.querySelectorAll('.tab')].find(x=>x.dataset.key===key); if(b)b.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
 try{localStorage.setItem('five_ai_active',key)}catch(e){}
}
let saved=null;try{saved=localStorage.getItem('five_ai_active')}catch(e){} if(SOURCES.some(x=>x.key===saved)) switchTo(saved); else switchTo('ChatGPT');
</script></body></html>
